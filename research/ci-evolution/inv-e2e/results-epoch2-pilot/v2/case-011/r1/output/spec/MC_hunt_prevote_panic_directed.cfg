\* Directed variant of MC_hunt_prevote_panic.cfg: state constraint
\* HuntOnlyNode1Elects (subset of reference behaviors).
\* Already-analyzed properties PreVoteStaleResponseIgnored and
\* TimerPreVoteElectionFromFollowerState are disabled here so that BFS is not
\* stopped by their shallow counterexamples (see bug-report.md).
\* Scenario U-C (stale grant from a node outside the new round's quorum set):
\* round A, membership change removing the responder, round B at the same
\* term, then the delayed round-A grant. Target: PreVoteResponseNeverPanics.
\* Full MCNext with membership enabled.
SPECIFICATION UpdateFullSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 2
    MaxLogIndex = 4
    PreVoteNodes <- ReferenceServer

    MaxElectionCount = 3
    MaxMembershipCount = 2
    MaxCrashCount = 0
    MaxDropCount = 0
    MaxMessageCount = 6

CONSTRAINT HuntOnlyNode1Elects
VIEW ModelView

INVARIANTS
    MCTypeOK
    DurableVoteNotAhead
    DurableLogNotAhead
    VoteRequestAfterDurable
    GrantedResponseAfterDurable
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    MembershipAtMostOneOutstanding
    NoForgedMessageEndpoints
    CertifiedLeaderHasFrozenQuorum
    \* update-specific state properties
    PreVoteResponseNeverPanics
    PreCandidateTracksNextTerm

PROPERTIES
    PreVoteResponderSideEffectFree
    PreVoteRequesterSideEffectFree
    PreVoteElectionAtPreVotedTerm
