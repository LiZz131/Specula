\* Open focused check: focus plus EnvUpdate rely for omitted
\* membership/log context (any valid configuration may be installed by an
\* established leader). Provisional until Update_discharge.cfg passes.
SPECIFICATION UpdateOpenSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 2
    MaxLogIndex = 4
    PreVoteNodes <- ReferenceServer

    MaxElectionCount = 3
    MaxMembershipCount = 2
    MaxCrashCount = 1
    MaxDropCount = 1
    MaxMessageCount = 5

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK
    DurableVoteNotAhead
    DurableLogNotAhead
    VoteRequestAfterDurable
    GrantedResponseAfterDurable
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    MembershipAtMostOneOutstanding
    NoForgedMessageEndpoints
    CertifiedLeaderHasFrozenQuorum
    \* update-specific state properties
    PreVoteResponseNeverPanics
    PreCandidateTracksNextTerm

PROPERTIES
    PreVoteResponderSideEffectFree
    PreVoteRequesterSideEffectFree
    PreVoteElectionAtPreVotedTerm
    PreVoteStaleResponseIgnored
    TimerPreVoteElectionFromFollowerState
