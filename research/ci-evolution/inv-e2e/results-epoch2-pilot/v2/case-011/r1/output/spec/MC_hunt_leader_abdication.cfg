\* PreVoteStaleResponseIgnored (MC-1, already analyzed) is disabled here so that BFS
\* is not stopped before the target TimerPreVoteElectionFromFollowerState; see
\* output/hunt-leader-abdication-bfs.first.log for the first run.
\* Scenario U-A (timer round outlives own election win): a Candidate's
\* election timer starts a Pre-Vote round; the earlier real election then wins;
\* the round's quorum makes the new Leader start another election.
\* Target: TimerPreVoteElectionFromFollowerState. Focused concrete actions.
SPECIFICATION UpdateFocusedSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 2
    MaxLogIndex = 4
    PreVoteNodes <- ReferenceServer

    MaxElectionCount = 2
    MaxMembershipCount = 2
    MaxCrashCount = 0
    MaxDropCount = 0
    MaxMessageCount = 5

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK
    DurableVoteNotAhead
    DurableLogNotAhead
    VoteRequestAfterDurable
    GrantedResponseAfterDurable
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    MembershipAtMostOneOutstanding
    NoForgedMessageEndpoints
    CertifiedLeaderHasFrozenQuorum
    \* update-specific state properties
    PreVoteResponseNeverPanics
    PreCandidateTracksNextTerm

PROPERTIES
    PreVoteResponderSideEffectFree
    PreVoteRequesterSideEffectFree
    PreVoteElectionAtPreVotedTerm
    TimerPreVoteElectionFromFollowerState
