\* Concrete focused control run: unchanged core safety properties plus the
\* structural update invariant over AffectedActions \/ InteractionActions from
\* the epoch-1 aftermath family (RecoveryInit); two further epochs, two crashes.
SPECIFICATION UpdateFocusedSpec
CONSTANTS
    Server = {s1, s2, s3}
    Txn = {t1}
    MaxEpoch = 3
    Nil = Nil
    NewLeaderLogsPending = TRUE
    MaxCrash = 2
    MaxDrop = 0
    MaxSnapshot = 0
CHECK_DEADLOCK FALSE
CONSTRAINT TimeBudget
SYMMETRY ModelSymmetry
INVARIANTS
    TypeOK
    ElectionSafety
    OneActiveLeaderPerEpoch
    CommittedHistoriesPrefix
    ApplyRequiresCommitCertificate
    PipelinePrefix
    EpochHistoryConsistency
    SyncCompletionJustified
    PendingOnlyDuringSync
PROPERTIES
    HistoryPositionsMonotonicExceptRecovery
