\* Simulation variant of MC.cfg (no level bound; depth set by -depth 100).
SPECIFICATION MCSpec

CONSTANTS
    Server = {s1, s2, s3}
    \* Canonical finite bound: three voters, one complete mutation, two epochs,
    \* and one occurrence of each bounded fault/recovery auxiliary action.
    Txn = {t1}
    MaxEpoch = 2
    Nil = Nil
    NewLeaderLogsPending = TRUE
    MaxCrash = 1
    MaxDrop = 1
    MaxSnapshot = 1

CHECK_DEADLOCK FALSE
SYMMETRY ModelSymmetry
CONSTRAINT TimeBudget

INVARIANTS
    TypeOK
    MCTypeOK
    ElectionSafety
    OneActiveLeaderPerEpoch
    CommittedHistoriesPrefix
    ApplyRequiresCommitCertificate
    PipelinePrefix
    EpochHistoryConsistency
    SyncCompletionJustified

PROPERTIES
    HistoryPositionsMonotonicExceptRecovery
