    Server = {s1, s2, s3}
    Txn = {t1, t2}
    MaxEpoch = 3
    Nil = Nil
    NewLeaderLogsPending = TRUE
    MaxCrash = 0
    MaxDrop = 0
    MaxSnapshot = 0
CHECK_DEADLOCK FALSE
CONSTRAINT TimeBudget
SYMMETRY ModelSymmetry
INVARIANTS
    TypeOK
    CommittedHistoriesPrefix
    SyncedLogMatchesLeader
