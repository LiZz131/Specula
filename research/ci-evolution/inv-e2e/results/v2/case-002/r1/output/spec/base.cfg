SPECIFICATION Spec

CONSTANTS
    Server = {s1, s2, s3}
    \* One transaction is sufficient to exercise every scoped pipeline stage;
    \* two epochs retain crash/restart followed by re-election coverage.
    Txn = {t1}
    MaxEpoch = 2
    Nil = Nil
    NewLeaderLogsPending = TRUE

CHECK_DEADLOCK FALSE
SYMMETRY ModelSymmetry
CONSTRAINT CanonicalDepthBound
CONSTRAINT TimeBudget

INVARIANTS
    TypeOK
    ElectionSafety
    OneActiveLeaderPerEpoch
    CommittedHistoriesPrefix
    ApplyRequiresCommitCertificate
    PipelinePrefix
    EpochHistoryConsistency
    SyncCompletionJustified

PROPERTIES
    HistoryPositionsMonotonicExceptRecovery
