\* Scenario U5: peer 3's network does not implement pre_vote (default impl grants); the timer may observe enable_pre_vote toggled at runtime.
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 2
    MaxLogIndex = 4
    TickPreVoteModes = {FALSE, TRUE}
    PreVoteFallbackPeers = {"3"}

    MaxElectionCount = 2
    MaxPreVoteCount = 2
    MaxMembershipCount = 0
    MaxCrashCount = 1
    MaxDropCount = 1
    MaxMessageCount = 5

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    DurableVoteNotAhead
    GrantedResponseAfterDurable
    PreCandidateProbeIsNextTerm

PROPERTIES
    \* TimerPreVoteElectsOnlyNonLeader / StalePreVoteResponseIgnored already have
    \* counterexamples (MC-1, MC-2); this hunt checks whether the fallback grant adds others.
    PreVoteResponseNeverPanics
    PreVoteProbeMatchesElection
    PreVoteRoundPersistsNothing
