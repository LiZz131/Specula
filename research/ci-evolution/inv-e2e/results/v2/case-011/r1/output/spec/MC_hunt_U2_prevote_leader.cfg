\* Scenario U2: a timer Pre-Vote round outlives the node's own leader establishment. Elections start only through Pre-Vote (enable_pre_vote = true); no membership, crash or drop noise.
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 2
    MaxLogIndex = 4
    TickPreVoteModes = {TRUE}
    PreVoteFallbackPeers = {}

    MaxElectionCount = 1
    MaxPreVoteCount = 2
    MaxMembershipCount = 0
    MaxCrashCount = 0
    MaxDropCount = 0
    MaxMessageCount = 5

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    DurableVoteNotAhead
    GrantedResponseAfterDurable
    PreCandidateProbeIsNextTerm

PROPERTIES
    TimerPreVoteElectsOnlyNonLeader
    PreVoteProbeMatchesElection
