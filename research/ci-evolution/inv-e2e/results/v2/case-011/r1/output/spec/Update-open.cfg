\* Open focused check: AffectedActions \/ InteractionActions \/ EnvUpdate (rely for
\* the omitted membership/log/refresh/transfer context). Provisional until discharge.
SPECIFICATION OpenUpdateSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 2
    MaxLogIndex = 4
    TickPreVoteModes = {TRUE}
    PreVoteFallbackPeers <- ReferencePreVoteFallbackPeers

    MaxElectionCount = 1
    MaxPreVoteCount = 2
    MaxMembershipCount = 2
    MaxCrashCount = 1
    MaxDropCount = 1
    MaxMessageCount = 5

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK
    PreCandidateProbeIsNextTerm

PROPERTIES
    TimerPreVoteElectsOnlyNonLeader
    StalePreVoteResponseIgnored
    PreVoteResponseNeverPanics
    PreVoteProbeMatchesElection
    PreVoteRoundPersistsNothing
