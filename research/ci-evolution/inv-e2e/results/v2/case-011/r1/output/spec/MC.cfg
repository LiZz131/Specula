SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 2
    MaxLogIndex = 4
    TickPreVoteModes <- ReferenceTickPreVoteModes
    PreVoteFallbackPeers <- ReferencePreVoteFallbackPeers

    MaxElectionCount = 2
    MaxPreVoteCount = 1
    MaxMembershipCount = 2
    MaxCrashCount = 1
    MaxDropCount = 1
    MaxMessageCount = 5

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK

    \* Core safety and persistence ordering
    DurableVoteNotAhead
    DurableLogNotAhead
    VoteRequestAfterDurable
    GrantedResponseAfterDurable
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    MembershipAtMostOneOutstanding
    NoForgedMessageEndpoints

    \* Neutral scenario property. This is enabled in the ordinary V0 run;
    \* there are no incident-specific hunt configurations in the prior.
    CertifiedLeaderHasFrozenQuorum
