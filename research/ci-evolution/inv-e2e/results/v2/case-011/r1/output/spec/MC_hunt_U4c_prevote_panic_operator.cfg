\* Scenario U4 (panic variant, operator rounds only): the timer never pre-votes (enable_pre_vote = false),
\* so every Pre-Vote round is an operator round; membership changes enabled; no drops.
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 2
    MaxLogIndex = 4
    TickPreVoteModes = {FALSE}
    PreVoteFallbackPeers = {}

    MaxElectionCount = 1
    MaxPreVoteCount = 2
    MaxMembershipCount = 2
    MaxCrashCount = 0
    MaxDropCount = 0
    MaxMessageCount = 5

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    DurableVoteNotAhead
    GrantedResponseAfterDurable
    PreCandidateProbeIsNextTerm

PROPERTIES
    PreVoteResponseNeverPanics
