\* Scenario U4 (panic variant): a granted Pre-Vote response from outside the current round frozen quorum set reaches grant_by. Membership changes enabled.
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 2
    MaxLogIndex = 4
    TickPreVoteModes = {TRUE}
    PreVoteFallbackPeers = {}

    MaxElectionCount = 1
    MaxPreVoteCount = 3
    MaxMembershipCount = 2
    MaxCrashCount = 0
    MaxDropCount = 1
    MaxMessageCount = 5

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    DurableVoteNotAhead
    GrantedResponseAfterDurable
    PreCandidateProbeIsNextTerm

PROPERTIES
    PreVoteResponseNeverPanics
