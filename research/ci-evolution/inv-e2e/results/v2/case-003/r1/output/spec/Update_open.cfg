\* Open focused: AffectedActions \/ InteractionActions \/ EnvUpdate (provisional until discharge passes).
SPECIFICATION OpenSpec

CONSTANTS
    MaxHeight = 3
    MaxBlocks = 3
    MaxCrashes = 2
    MaxAppRollbacks = 1
    Rest = {"r0", "rBad"}
    ValidRest = {"r0"}
    VEProposals = {0, 1, 2, 3, 4}
    VEValues <- MCVEValues
    NoRest = "none"
    InitialRest = "r0"
    InitialVEs = {0, 2}
    InitialParams <- MCInitialParams

INVARIANTS
    MCTypeOK
    PersistedHeightRelationships
    VEHistoryStable
    VEEnableMonotone
    StartupLastCommitConsistent
    AcceptedVEUpdateRespectsRules
    PermittedVEUpdateNotRejected
    UnchangedVEUpdateNotRejected
