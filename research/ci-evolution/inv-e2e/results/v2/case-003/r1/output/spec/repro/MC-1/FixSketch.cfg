\* MC-1 fix sketch: all reference + update properties over full MCNext with ValidateUpdateOK <- FixedValidateUpdateOK. MCTypeOK omitted: its observer-only coverage domain has no "veAccRow6" marker, which an accepted unchanged value produces under the override.
SPECIFICATION MCSpec

CONSTANTS
    MaxHeight = 3
    MaxBlocks = 3
    MaxCrashes = 2
    MaxAppRollbacks = 1
    Rest = {"r0", "r1", "rBad"}
    ValidRest = {"r0", "r1"}
    VEProposals = {0, 1, 2, 3, 4}
    VEValues <- MCVEValues
    NoRest = "none"
    InitialRest = "r0"
    InitialVEs = {0, 2}
    InitialParams <- MCInitialParams
    ValidateUpdateOK <- FixedValidateUpdateOK

INVARIANTS
    RejectedUpdateDoesNotInstall
    ParameterUpdateReflected
    NormalPhaseIsSynchronized
    RecoveryNormalOnlySupported
    SuccessfulApplyAdvancesExactlyOne
    PersistedHeightRelationships
    VEHistoryStable
    VEEnableMonotone
    StartupLastCommitConsistent
    AcceptedVEUpdateRespectsRules
    PermittedVEUpdateNotRejected
    UnchangedVEUpdateNotRejected
