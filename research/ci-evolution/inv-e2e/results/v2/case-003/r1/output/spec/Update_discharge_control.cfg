\* Negative control: DischargeContext with a too-strong rely must FAIL (non-vacuity of the discharge check).
SPECIFICATION MCSpec

CONSTANTS
    MaxHeight = 3
    MaxBlocks = 3
    MaxCrashes = 2
    MaxAppRollbacks = 1
    Rest = {"r0", "rBad"}
    ValidRest = {"r0"}
    VEProposals = {0, 2}
    VEValues <- MCVEValues
    NoRest = "none"
    InitialRest = "r0"
    InitialVEs = {0, 2}
    InitialParams <- MCInitialParams

INVARIANTS
    MCTypeOK
PROPERTIES
    DischargeControlTooStrong
