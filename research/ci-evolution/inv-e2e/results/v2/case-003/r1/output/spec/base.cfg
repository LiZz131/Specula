\* Plain reference configuration (unbounded block production up to MaxHeight).
INIT Init
NEXT Next

CONSTANTS
    MaxHeight = 2
    Rest = {"r0", "r1", "rBad"}
    ValidRest = {"r0", "r1"}
    VEValues <- BaseVEValues
    NoRest = "none"
    InitialParams <- BaseInitialParams

INVARIANTS
    TypeOK
    PersistedHeightRelationships
    SuccessfulApplyAdvancesExactlyOne
    RejectedUpdateDoesNotInstall
    ParameterUpdateReflected
    NormalPhaseIsSynchronized
    RecoveryNormalOnlySupported
