SPECIFICATION TraceSpec
VIEW TraceView
ALIAS TraceAlias
CHECK_DEADLOCK FALSE

CONSTANTS
    Server = {"s0", "s1", "s2"}
    MaxEpoch = 10
    MaxTxn = 16
    NoServer = "NoServer"
    CodeVersion = "new"

INVARIANTS
    TypeOK
    ActiveLeaderUniqueness
    AcceptedEpochGECurrentEpoch
    OrderedHistories
    CommittedPrefixAgreement
    NormalAckHasDurabilityEvidence
    ApplyHasCommitCertificate
    SyncEntryJustified
    SnapshotPublishedValid

PROPERTIES
    TraceMatched
