\* Module: Update.tla (EXTENDS MC). Open focused check: focused actions plus EnvUpdate rely for omitted crash/recover/loss/discard.
INIT MCInit
NEXT OpenNext
CHECK_DEADLOCK FALSE

CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    Server <- MCServer
    AllowedConfigs <- MCAllowedConfigs
    MaxTerm = 2
    MaxIndex = 1
    MaxElectionActions = 2
    MaxClientAppends = 1
    MaxMembershipChanges = 1
    MaxCrashes = 1
    MaxLosses = 1

SYMMETRY Symmetry
VIEW MCView
CONSTRAINT MessageBufferBound
INVARIANTS
    MCTypeOK
    ElectionSafety
    ActiveLeaderHasCommittedVote
    CommitWithinLocalLog
    CommittedLogAgreement
    MembershipOrder
    EffectiveIsLastLogMembership
    \* OneOutstandingMembership: not enabled with crashes (Case A, restart resets the volatile commit; see changelog Round 2)
    CommitWitnessSound_new
    LeaderProgressConfigCurrent
PROPERTIES
    ProgressMonotonic
