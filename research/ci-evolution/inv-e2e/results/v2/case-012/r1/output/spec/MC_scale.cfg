INIT MCInit
NEXT MCNext
CHECK_DEADLOCK FALSE

CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    Server <- MCServer
    AllowedConfigs <- MCAllowedConfigs
    MaxTerm = 2
    MaxIndex = 2
    MaxElectionActions = 3
    MaxClientAppends = 2
    MaxMembershipChanges = 1
    MaxCrashes = 1
    MaxLosses = 1

SYMMETRY Symmetry
VIEW MCView
CONSTRAINT MessageBufferBound

INVARIANTS
    MCTypeOK
    ElectionSafety
    ActiveLeaderHasCommittedVote
    CommitWithinLocalLog
    CommittedLogAgreement
    MembershipOrder
