\* Differential consequence control for U1 (exact-old learner exit, reference properties only). A violation here is control evidence, NOT a finding against the updated source.
CONSTANTS
    Server = {s1, s2, s3}
    NoServer = NoServer
    MaxEpoch = 1
    MaxTxn = 2
    MaxRounds = 0
    MaxCrashes = 0
    MaxExits = 2
    MaxSnapshots = 0
    UpdateFullShutdownOnSnap = FALSE
    TrackCoverage = FALSE
INIT MCInit
NEXT FocusNext
ACTION_CONSTRAINT SnapSteer
CHECK_DEADLOCK FALSE
INVARIANTS
    MCTypeOK
    LeaderUniquenessPerEpoch
    AcceptedEpochGECurrentEpoch
    OrderedHistories
    CommittedPrefixAgreement
    NormalAckHasDurabilityEvidence
    ApplyHasCommitCertificate
    SyncEntryJustified
    SnapshotPublishedValid
    DurableHistoryConsistent
    LeaderCompleteness
PROPERTIES
    MonotoneUnlessRecovery
