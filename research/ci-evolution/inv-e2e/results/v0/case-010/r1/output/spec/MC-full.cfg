\* Broader fault bounds over complete MCNext (two rounds, two crashes, two learner exits).
CONSTANTS
    Server = {s1, s2, s3}
    NoServer = NoServer
    MaxEpoch = 2
    MaxTxn = 2
    MaxRounds = 2
    MaxCrashes = 2
    MaxExits = 2
    MaxSnapshots = 0
    UpdateFullShutdownOnSnap = TRUE
    TrackCoverage = FALSE
SYMMETRY Symmetry
INIT MCInit
NEXT MCNext
CHECK_DEADLOCK FALSE
INVARIANTS
    MCTypeOK
    LeaderUniquenessPerEpoch
    AcceptedEpochGECurrentEpoch
    OrderedHistories
    CommittedPrefixAgreement
    NormalAckHasDurabilityEvidence
    ApplyHasCommitCertificate
    SyncEntryJustified
    SnapshotPublishedValid
    DurableHistoryConsistent
    LeaderCompleteness
PROPERTIES
    MonotoneUnlessRecovery
