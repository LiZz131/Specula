    NoServer = NoServer
    MaxEpoch = 1
    MaxTxn = 2
    MaxRounds = 0
    MaxCrashes = 0
    MaxExits = 2
    MaxSnapshots = 0
    UpdateFullShutdownOnSnap = TRUE
    TrackCoverage = FALSE
INIT MCInit
NEXT FocusNext
ACTION_CONSTRAINT TruncLogSteer
CHECK_DEADLOCK FALSE
INVARIANTS
    MCTypeOK
    LeaderUniquenessPerEpoch
    AcceptedEpochGECurrentEpoch
