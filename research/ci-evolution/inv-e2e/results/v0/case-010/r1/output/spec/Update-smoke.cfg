\* Smoke/reachability: simulation over full MCNext with coverage marks.
CONSTANTS
    Server = {s1, s2, s3}
    MaxEpoch = 3
    MaxTxn = 3
    NoServer = NoServer
    UpdateFullShutdownOnSnap = TRUE
    TrackCoverage = TRUE
    MaxRounds = 2
    MaxCrashes = 2
    MaxExits = 2
    MaxSnapshots = 1
INIT MCInit
NEXT MCNext
CHECK_DEADLOCK FALSE
INVARIANTS
    MCTypeOK
    LeaderUniquenessPerEpoch
    AcceptedEpochGECurrentEpoch
    OrderedHistories
    CommittedPrefixAgreement
    NormalAckHasDurabilityEvidence
    ApplyHasCommitCertificate
    SyncEntryJustified
    SnapshotPublishedValid
    DurableHistoryConsistent
    LeaderCompleteness
    ReportedHistoryDurable
    SnapExitReportsDisk
PROPERTIES
    MonotoneUnlessRecovery
