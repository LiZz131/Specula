\* Scenario U1 hunt: lagging learner, SNAP sync, exits; no crash, single round.
CONSTANTS
    Server = {s1, s2, s3}
    NoServer = NoServer
    MaxEpoch = 1
    MaxTxn = 2
    MaxRounds = 0
    MaxCrashes = 0
    MaxExits = 2
    MaxSnapshots = 0
    UpdateFullShutdownOnSnap = TRUE
    TrackCoverage = FALSE
SYMMETRY Symmetry
INIT MCInit
NEXT FocusNext
CHECK_DEADLOCK FALSE
INVARIANTS
    MCTypeOK
    LeaderUniquenessPerEpoch
    AcceptedEpochGECurrentEpoch
    OrderedHistories
    CommittedPrefixAgreement
    NormalAckHasDurabilityEvidence
    ApplyHasCommitCertificate
    SyncEntryJustified
    SnapshotPublishedValid
    DurableHistoryConsistent
    LeaderCompleteness
    ReportedHistoryDurable
    SnapExitReportsDisk
PROPERTIES
    MonotoneUnlessRecovery
