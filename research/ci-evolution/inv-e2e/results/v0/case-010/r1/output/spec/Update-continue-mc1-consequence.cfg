\* Consequence of MC-1 on the updated source: continue from the reachable final state of the
\* MC-1 counterexample (learner LOOKING with a non-durable in-memory record) with one more record
\* allowed; reference properties only (does the retained record become a durable hole?).
CONSTANTS
    Server = {s1, s2, s3}
    NoServer = NoServer
    s1 = s1
    s2 = s2
    s3 = s3
    MaxEpoch = 1
    MaxTxn = 3
    MaxRounds = 0
    MaxCrashes = 0
    MaxExits = 2
    MaxSnapshots = 0
    UpdateFullShutdownOnSnap = TRUE
    TrackCoverage = TRUE
INIT ContinueInit
NEXT FocusNext
CHECK_DEADLOCK FALSE
INVARIANTS
    MCTypeOK
    LeaderUniquenessPerEpoch
    AcceptedEpochGECurrentEpoch
    OrderedHistories
    CommittedPrefixAgreement
    NormalAckHasDurabilityEvidence
    ApplyHasCommitCertificate
    SyncEntryJustified
    SnapshotPublishedValid
    DurableHistoryConsistent
    LeaderCompleteness
