\* MC-2 variant search: TruncSteer2 schedule, LeaderCompleteness focus (DurableHistoryConsistent and update properties removed so the search continues past the first symptom).
CONSTANTS
    Server = {s1, s2, s3}
    NoServer = NoServer
    MaxEpoch = 2
    MaxTxn = 3
    MaxRounds = 1
    MaxCrashes = 1
    MaxExits = 1
    MaxSnapshots = 0
    UpdateFullShutdownOnSnap = TRUE
    TrackCoverage = FALSE
INIT MCInit
NEXT FocusNext
ACTION_CONSTRAINT TruncSteer2
CHECK_DEADLOCK FALSE
INVARIANTS
    MCTypeOK
    LeaderUniquenessPerEpoch
    AcceptedEpochGECurrentEpoch
    OrderedHistories
    CommittedPrefixAgreement
    NormalAckHasDurabilityEvidence
    ApplyHasCommitCertificate
    SyncEntryJustified
    SnapshotPublishedValid
    LeaderCompleteness
PROPERTIES
    MonotoneUnlessRecovery
