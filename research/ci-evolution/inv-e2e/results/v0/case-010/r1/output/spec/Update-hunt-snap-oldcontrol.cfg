\* Differential non-vacuity control for U1: exact-old learner exit (UpdateFullShutdownOnSnap=FALSE). A violation here is evidence that the U1 properties can detect the pre-update defect class; it is NOT a finding against the updated source.
CONSTANTS
    Server = {s1, s2, s3}
    NoServer = NoServer
    MaxEpoch = 1
    MaxTxn = 2
    MaxRounds = 0
    MaxCrashes = 0
    MaxExits = 2
    MaxSnapshots = 0
    UpdateFullShutdownOnSnap = FALSE
    TrackCoverage = FALSE
SYMMETRY Symmetry
INIT MCInit
NEXT FocusNext
CHECK_DEADLOCK FALSE
INVARIANTS
    MCTypeOK
    LeaderUniquenessPerEpoch
    AcceptedEpochGECurrentEpoch
    OrderedHistories
    CommittedPrefixAgreement
    NormalAckHasDurabilityEvidence
    ApplyHasCommitCertificate
    SyncEntryJustified
    SnapshotPublishedValid
    DurableHistoryConsistent
    LeaderCompleteness
    ReportedHistoryDurable
    SnapExitReportsDisk
PROPERTIES
    MonotoneUnlessRecovery
