\* Reference sanity cfg: complete unbounded base Next with a round bound.
CONSTANTS
    Server = {s1, s2, s3}
    MaxEpoch = 1
    MaxTxn = 1
    NoServer = NoServer
    UpdateFullShutdownOnSnap = TRUE
INIT Init
NEXT Next
CONSTRAINT BaseConstraint
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    LeaderUniquenessPerEpoch
    AcceptedEpochGECurrentEpoch
    OrderedHistories
    CommittedPrefixAgreement
    NormalAckHasDurabilityEvidence
    ApplyHasCommitCertificate
    SyncEntryJustified
    SnapshotPublishedValid
    DurableHistoryConsistent
    LeaderCompleteness
PROPERTIES
    MonotoneUnlessRecovery
