\* Wider history bound (three transactions) over complete MCNext.
CONSTANTS
    Server = {s1, s2, s3}
    NoServer = NoServer
    MaxEpoch = 2
    MaxTxn = 3
    MaxRounds = 1
    MaxCrashes = 1
    MaxExits = 1
    MaxSnapshots = 0
    UpdateFullShutdownOnSnap = TRUE
    TrackCoverage = FALSE
SYMMETRY Symmetry
INIT MCInit
NEXT MCNext
CHECK_DEADLOCK FALSE
INVARIANTS
    MCTypeOK
    LeaderUniquenessPerEpoch
    AcceptedEpochGECurrentEpoch
    OrderedHistories
    CommittedPrefixAgreement
    NormalAckHasDurabilityEvidence
    ApplyHasCommitCertificate
    SyncEntryJustified
    SnapshotPublishedValid
    DurableHistoryConsistent
    LeaderCompleteness
PROPERTIES
    MonotoneUnlessRecovery
