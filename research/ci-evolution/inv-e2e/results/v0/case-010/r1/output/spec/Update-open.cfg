\* Update campaign 3a: open focused spec with EnvUpdate rely for omitted snapshot actions.
CONSTANTS
    Server = {s1, s2, s3}
    NoServer = NoServer
    MaxEpoch = 2
    MaxTxn = 2
    MaxRounds = 1
    MaxCrashes = 1
    MaxExits = 1
    MaxSnapshots = 1
    UpdateFullShutdownOnSnap = TRUE
    TrackCoverage = FALSE
SYMMETRY Symmetry
INIT MCInit
NEXT OpenUpdateNext
CHECK_DEADLOCK FALSE
INVARIANTS
    MCTypeOK
    LeaderUniquenessPerEpoch
    AcceptedEpochGECurrentEpoch
    OrderedHistories
    CommittedPrefixAgreement
    NormalAckHasDurabilityEvidence
    ApplyHasCommitCertificate
    SyncEntryJustified
    SnapshotPublishedValid
    DurableHistoryConsistent
    LeaderCompleteness
    ReportedHistoryDurable
    SnapExitReportsDisk
PROPERTIES
    MonotoneUnlessRecovery
