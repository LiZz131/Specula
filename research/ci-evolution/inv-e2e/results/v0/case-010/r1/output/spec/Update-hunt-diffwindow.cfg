\* Scenario U3 hunt: DIFF learner exits between NEWLEADER and UPTODATE (unchanged path adjacent to the update), then re-election.
CONSTANTS
    Server = {s1, s2, s3}
    NoServer = NoServer
    MaxEpoch = 2
    MaxTxn = 3
    MaxRounds = 1
    MaxCrashes = 1
    MaxExits = 1
    MaxSnapshots = 0
    UpdateFullShutdownOnSnap = TRUE
    TrackCoverage = FALSE
SYMMETRY Symmetry
INIT MCInit
NEXT FocusNext
CHECK_DEADLOCK FALSE
INVARIANTS
    MCTypeOK
    LeaderUniquenessPerEpoch
    AcceptedEpochGECurrentEpoch
    OrderedHistories
    CommittedPrefixAgreement
    NormalAckHasDurabilityEvidence
    ApplyHasCommitCertificate
    SyncEntryJustified
    SnapshotPublishedValid
    DurableHistoryConsistent
    LeaderCompleteness
    ReportedHistoryDurable
    SnapExitReportsDisk
PROPERTIES
    MonotoneUnlessRecovery
