INIT MCInit
NEXT MCNext
CHECK_DEADLOCK FALSE

CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    Server <- MCServer
    ServerOrder <- MCServerOrder
    AllowedConfigs <- MCAllowedConfigs
    MaxTerm = 1
    MaxIndex = 1
    MaxElectionActions = 1
    MaxClientAppends = 0
    MaxMembershipChanges = 1
    MaxCrashes = 0
    MaxLosses = 0

VIEW MCView
CONSTRAINT MessageBufferBound

INVARIANTS
    MCTypeOK
    ElectionSafety
    ActiveLeaderHasCommittedVote
    CommitWithinLocalLog
    CommittedLogAgreement
    MembershipOrder
    OneOutstandingMembershipDurable
    CommitWitnessSound
    ProgressCommittedSound
    ProgressWithinReplication
    ProgressTracksEffective

\* U1/U3 consequence hunt: same bounds; the structural VecProgress invariant is
\* checked by Update_hunt_u1_membership_progress.cfg, so it is omitted here to
\* expose the first externally meaningful consequence.
