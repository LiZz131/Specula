INIT MCInit
NEXT MCNext
CHECK_DEADLOCK FALSE

CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    Server <- MCServer
    ServerOrder <- MCServerOrder
    AllowedConfigs <- MCAllowedConfigs
    MaxTerm = 1
    MaxIndex = 1
    MaxElectionActions = 1
    MaxClientAppends = 1
    MaxMembershipChanges = 0
    MaxCrashes = 0
    MaxLosses = 0

VIEW MCView
CONSTRAINT MessageBufferBound

INVARIANTS
    MCTypeOK
    ElectionSafety
    ActiveLeaderHasCommittedVote
    CommitWithinLocalLog
    CommittedLogAgreement
    MembershipOrder

