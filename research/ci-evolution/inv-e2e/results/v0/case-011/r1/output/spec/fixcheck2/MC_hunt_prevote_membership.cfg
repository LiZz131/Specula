\* HUNT U3/U2: Pre-Vote x membership change on the one-voter seed (voter gate, probed term).
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig = {"1"}
    TickPreVoteModes <- PreVoteOnly
    MaxTerm = 2
    MaxLogIndex = 4

    MaxElectionCount = 2
    MaxMembershipCount = 2
    MaxCrashCount = 0
    MaxDropCount = 1
    MaxMessageCount = 4

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK
    DurableVoteNotAhead
    DurableLogNotAhead
    VoteRequestAfterDurable
    GrantedResponseAfterDurable
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    MembershipAtMostOneOutstanding
    NoForgedMessageEndpoints
    CertifiedLeaderHasFrozenQuorum
    PreCandidateProbesNextSelfTerm

PROPERTIES
    PreVoteElectOnlyByVoter
    PreVoteElectsAtProbedTerm
