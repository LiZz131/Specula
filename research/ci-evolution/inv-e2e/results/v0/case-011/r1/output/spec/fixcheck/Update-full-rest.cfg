\* Full update check of U2-U4 and the interaction invariant over complete MCNext (U1 checked separately because TLC stops at its first violation).
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    TickPreVoteModes <- PreVoteToggle
    MaxTerm = 2
    MaxLogIndex = 4

    MaxElectionCount = 2
    MaxMembershipCount = 2
    MaxCrashCount = 1
    MaxDropCount = 1
    MaxMessageCount = 5

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK
    DurableVoteNotAhead
    DurableLogNotAhead
    VoteRequestAfterDurable
    GrantedResponseAfterDurable
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    MembershipAtMostOneOutstanding
    NoForgedMessageEndpoints
    CertifiedLeaderHasFrozenQuorum
    PreCandidateProbesNextSelfTerm

PROPERTIES
    PreVoteElectsAtProbedTerm
    PreVoteElectOnlyByVoter
    PreVoteHandlingIsSideEffectFree
