\* CANARY (expected violation): a Pre-Vote quorum triggers a real election in full MCSpec.
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    TickPreVoteModes <- PreVoteOnly
    MaxTerm = 2
    MaxLogIndex = 4

    MaxElectionCount = 2
    MaxMembershipCount = 2
    MaxCrashCount = 1
    MaxDropCount = 1
    MaxMessageCount = 5

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK

PROPERTIES
    CanaryNoPreVoteWin
