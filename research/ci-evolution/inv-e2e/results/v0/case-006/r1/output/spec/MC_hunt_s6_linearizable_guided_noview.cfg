\* Guided S6b hunt without VIEW MCView: the inherited view drops faultCounters,
\* which can mask paths that need the remaining counter budget.
SPECIFICATION MCSpec

CHECK_DEADLOCK FALSE

CONSTANTS
    Server = {s1, s2, s3}
    Values = {v1}
    ReadContexts = {ctx1}
    Nil = Nil
    MaxTerm = 2
    MaxLogLen = 2
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    MsgVote = MsgVote
    MsgVoteResp = MsgVoteResp
    MsgApp = MsgApp
    MsgAppResp = MsgAppResp
    MsgHeartbeat = MsgHeartbeat
    MsgHeartbeatResp = MsgHeartbeatResp
    MsgReadIndex = MsgReadIndex
    MsgReadIndexResp = MsgReadIndexResp
    MaxCampaignLimit = 2
    MaxProposalLimit = 0
    MaxHeartbeatLimit = 0
    MaxReadLimit = 2
    MaxReadyLimit = 10
    MaxQuorumCheckLimit = 0
    MaxCrashLimit = 0
    MaxLoseLimit = 0
    MaxMsgBufferLimit = 9

CONSTRAINT S6GuideConstraint
SYMMETRY ModelSymmetry

INVARIANTS
    MCTypeOK
    MCElectionSafety
    MCCommittedPrefixAgreement
    MCLeaderCompleteness
    MCReadDeliveryJustified
    UpdReadIndexLinearizable
    UpdPublishedFromRelease
