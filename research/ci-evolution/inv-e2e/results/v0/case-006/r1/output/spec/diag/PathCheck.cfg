    MaxLogLen = 2
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    MsgVote = MsgVote
    MsgVoteResp = MsgVoteResp
    MsgApp = MsgApp
    MsgAppResp = MsgAppResp
    MsgHeartbeat = MsgHeartbeat
    MsgHeartbeatResp = MsgHeartbeatResp
    MsgReadIndex = MsgReadIndex
    MsgReadIndexResp = MsgReadIndexResp
    MaxCampaignLimit = 2
    MaxProposalLimit = 0
    MaxHeartbeatLimit = 0
    MaxReadLimit = 2
    MaxReadyLimit = 10
    MaxQuorumCheckLimit = 0
    MaxCrashLimit = 0
    MaxLoseLimit = 0
