SPECIFICATION TraceSpec

CONSTANTS
    Server = {"s1", "s2", "s3"}
    Values = {"v1"}
    ReadContexts = {"ctx1", "ctx2"}
    Nil = "Nil"
    MaxTerm = 2
    MaxLogLen = 3
    Follower = "Follower"
    Candidate = "Candidate"
    Leader = "Leader"
    MsgVote = "MsgVote"
    MsgVoteResp = "MsgVoteResp"
    MsgApp = "MsgApp"
    MsgAppResp = "MsgAppResp"
    MsgHeartbeat = "MsgHeartbeat"
    MsgHeartbeatResp = "MsgHeartbeatResp"
    MsgReadIndex = "MsgReadIndex"
    MsgReadIndexResp = "MsgReadIndexResp"
    TraceFile = "/work/current/.specula-output/traces/step_down_reads.ndjson"

CHECK_DEADLOCK FALSE

INVARIANTS
    TraceCanProgress
    TraceTypeOK
    ElectionSafety
    CommitWithinLog
    LogMatching
    CommittedPrefixAgreement
    LeaderCompleteness
    MessagesWellFormed
    ReadDeliveryJustified
    ReadyNoInvention
    UpdPendingQueueAgreement
    UpdQueueNoDuplicates
    UpdReadIndexLinearizable
    UpdPublishedFromRelease
    UpdReadAckAfterEnqueue
PROPERTIES
    TraceMatched
