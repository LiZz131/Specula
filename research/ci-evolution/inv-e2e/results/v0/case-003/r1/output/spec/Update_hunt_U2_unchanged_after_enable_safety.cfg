\* Safety variant (P-U1 excluded so the remaining space is explored past the known P-U1 violation).
\* Scenario U2: VE enabled at genesis (height 1); app re-sends its Abci
\* sub-record (e.g. a full ConsensusParams echo) together with a body change.
SPECIFICATION MCSpec

CONSTANTS
    MaxHeight = 2
    MaxBlocks = 2
    MaxCrashes = 1
    MaxAppRollbacks = 0
    Bodies = {"b0", "b1"}
    ValidBodies = {"b0", "b1"}
    VEHValues = {0, 1, 2, 3}
    InitialBody = "b0"
    InitialVEHs = {1}
    NoParam = NoParam
    NoAbci = NoAbci

INVARIANTS
    MCTypeOK
    RejectedUpdateDoesNotInstall
    ParameterUpdateReflected
    VEEnableHeightImmutableOnceEnabled
    VEStatusOfDecidedHeightsPreserved
    MockReplayRevalidationAccepts
