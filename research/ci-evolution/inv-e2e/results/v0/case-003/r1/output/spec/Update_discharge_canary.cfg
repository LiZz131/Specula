\* Discharge non-vacuity canary: expected violation (omitted Actions fire).
SPECIFICATION MCSpec

CONSTANTS
    MaxHeight = 2
    MaxBlocks = 2
    MaxCrashes = 2
    MaxAppRollbacks = 1
    Bodies = {"b0", "b1", "bBad"}
    ValidBodies = {"b0", "b1"}
    VEHValues <- MCVEHValuesWithNegative
    InitialBody = "b0"
    InitialVEHs = {0, 1}
    NoParam = NoParam
    NoAbci = NoAbci

INVARIANTS
    MCTypeOK
PROPERTIES
    DischargeCanaryOmittedNeverFires
