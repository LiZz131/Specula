\* V1 standard convergence config: reference (non-update) invariants only.
\* Update-specific properties are enabled in Update_*.cfg.
SPECIFICATION MCSpec

CONSTANTS
    MaxHeight = 2
    MaxBlocks = 2
    MaxCrashes = 2
    MaxAppRollbacks = 1
    Bodies = {"b0", "b1", "bBad"}
    ValidBodies = {"b0", "b1"}
    VEHValues <- MCVEHValuesWithNegative
    InitialBody = "b0"
    InitialVEHs = {0, 1}
    NoParam = NoParam
    NoAbci = NoAbci

INVARIANTS
    MCTypeOK
    PersistedHeightRelationships
    SuccessfulApplyAdvancesExactlyOne
    RejectedUpdateDoesNotInstall
    ParameterUpdateReflected
    NormalPhaseIsSynchronized
    RecoveryNormalOnlySupported
    InstalledParamsBasicValid
