\* V1 trace validation config.  NoParam/NoAbci are model values; the trace
\* domains are derived from the trace itself (see Trace.tla).
SPECIFICATION TraceSpec

CONSTANTS
    MaxHeight = 100
    NoParam = NoParam
    NoAbci = NoAbci
    Bodies <- TraceBodies
    ValidBodies <- TraceValidBodies
    VEHValues <- TraceVEHValues
    InitialBody <- TraceInitialBody
    InitialVEHs <- TraceInitialVEHs

INVARIANTS
    TypeOK
    PersistedHeightRelationships
    SuccessfulApplyAdvancesExactlyOne
    RejectedUpdateDoesNotInstall
    ParameterUpdateReflected
    NormalPhaseIsSynchronized
    RecoveryNormalOnlySupported
    InstalledParamsBasicValid

PROPERTIES
    TraceMatched
