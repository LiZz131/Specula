\* V1 base config (Init/Next without MC counters).
INIT Init
NEXT Next

CONSTANTS
    MaxHeight = 2
    Bodies = {"b0", "b1", "bBad"}
    ValidBodies = {"b0", "b1"}
    VEHValues = {0, 1, 2, 3}
    InitialBody = "b0"
    InitialVEHs = {0, 1}
    NoParam = NoParam
    NoAbci = NoAbci

INVARIANTS
    TypeOK
    PersistedHeightRelationships
    SuccessfulApplyAdvancesExactlyOne
    RejectedUpdateDoesNotInstall
    ParameterUpdateReflected
    NormalPhaseIsSynchronized
    RecoveryNormalOnlySupported
    InstalledParamsBasicValid
