\* Full update check: update properties over complete MCNext (MCSpec).
SPECIFICATION MCSpec

CONSTANTS
    MaxHeight = 2
    MaxBlocks = 2
    MaxCrashes = 2
    MaxAppRollbacks = 1
    Bodies = {"b0", "b1", "bBad"}
    ValidBodies = {"b0", "b1"}
    VEHValues <- MCVEHValuesWithNegative
    InitialBody = "b0"
    InitialVEHs = {0, 1}
    NoParam = NoParam
    NoAbci = NoAbci

INVARIANTS
    MCTypeOK
    PersistedHeightRelationships
    SuccessfulApplyAdvancesExactlyOne
    RejectedUpdateDoesNotInstall
    ParameterUpdateReflected
    NormalPhaseIsSynchronized
    RecoveryNormalOnlySupported
    InstalledParamsBasicValid
    ContractLegalUpdateAccepted
    VEEnableHeightImmutableOnceEnabled
    VEStatusOfDecidedHeightsPreserved
    MockReplayRevalidationAccepts
