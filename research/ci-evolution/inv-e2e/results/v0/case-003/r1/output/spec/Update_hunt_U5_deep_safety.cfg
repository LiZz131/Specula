\* Scenario U3/U4 deep: larger heights and enable-height domain; P-U1 excluded
\* (known violation) so the VE-safety and recovery properties are explored deeper.
SPECIFICATION MCSpec

CONSTANTS
    MaxHeight = 4
    MaxBlocks = 4
    MaxCrashes = 2
    MaxAppRollbacks = 1
    Bodies = {"b0", "bBad"}
    ValidBodies = {"b0"}
    VEHValues = {0, 1, 2, 3, 4, 5}
    InitialBody = "b0"
    InitialVEHs = {0, 2, 3}
    NoParam = NoParam
    NoAbci = NoAbci

INVARIANTS
    MCTypeOK
    PersistedHeightRelationships
    SuccessfulApplyAdvancesExactlyOne
    RejectedUpdateDoesNotInstall
    ParameterUpdateReflected
    NormalPhaseIsSynchronized
    RecoveryNormalOnlySupported
    InstalledParamsBasicValid
    VEEnableHeightImmutableOnceEnabled
    VEStatusOfDecidedHeightsPreserved
    MockReplayRevalidationAccepts
