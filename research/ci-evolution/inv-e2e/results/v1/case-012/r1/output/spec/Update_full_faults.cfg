\* Update view; module Update.tla
INIT MCInit
NEXT MCNext
CHECK_DEADLOCK FALSE

CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    Server <- MCServer
    ServerOrder <- MCServerOrder
    AllowedConfigs <- MCAllowedConfigs
    MaxTerm = 2
    MaxIndex = 1
    MaxElectionActions = 2
    MaxClientAppends = 1
    MaxMembershipChanges = 1
    MaxCrashes = 1
    MaxLosses = 1

VIEW MCView
CONSTRAINT MessageBufferBound

INVARIANTS
    MCTypeOK
    ElectionSafety
    CommitWithinLocalLog
    CommittedLogAgreement
    MembershipOrder
    UpdCommitWitnessSound
    ProgressCommittedSupported
    ProgressCommittedGreatest
    ProgressSortedAboveCommitted
    ProgressWithinAcks

\* OneOutstandingMembership is excluded only here: its premise uses the volatile
\* commit index, which restart resets to None while the persisted membership state
\* is kept (raft_core.rs:181-205; engine_impl.rs:381 TODO).  The unchanged V0 model
\* violates it identically (spec/output/mc-v0-control-oneoutstanding-crash.log).
