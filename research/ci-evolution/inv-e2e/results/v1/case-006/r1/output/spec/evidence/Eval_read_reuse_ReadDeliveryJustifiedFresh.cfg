\* Update scenarios US1/US2/US3/US6: conformance gate (update read
\* properties evaluated separately in Trace_read_reuse_props.cfg).
SPECIFICATION TraceSpec

CONSTANTS
    Server = {"s1", "s2", "s3"}
    Values = {"v1"}
    ReadContexts = {"ctx1", "ctx2"}
    Nil = "Nil"
    MaxTerm = 3
    MaxLogLen = 4
    Follower = "Follower"
    Candidate = "Candidate"
    Leader = "Leader"
    MsgVote = "MsgVote"
    MsgVoteResp = "MsgVoteResp"
    MsgApp = "MsgApp"
    MsgAppResp = "MsgAppResp"
    MsgHeartbeat = "MsgHeartbeat"
    MsgHeartbeatResp = "MsgHeartbeatResp"
    MsgReadIndex = "MsgReadIndex"
    MsgReadIndexResp = "MsgReadIndexResp"
    TraceFile = "../traces/read_reuse.ndjson"

CHECK_DEADLOCK FALSE

INVARIANTS
    TraceCanProgress
    ReadDeliveryJustifiedFresh

PROPERTIES
    TraceMatched
