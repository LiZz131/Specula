\* Scenario hunt US4 on the concrete focused spec (context reuse + delayed ack +
\* newer leader); targets ReadIndexFreshness + core.
\* Intended for BFS then simulation (-simulate) on Update.tla.
SPECIFICATION FocusedSpec
CHECK_DEADLOCK FALSE

CONSTANTS
    Server = {s1, s2, s3}
    Values = {v1}
    ReadContexts = {ctx1}
    MaxTerm = 2
    MaxLogLen = 2
    MaxCampaignLimit = 2
    MaxProposalLimit = 0
    MaxHeartbeatLimit = 0
    MaxReadLimit = 2
    MaxReadyLimit = 14
    MaxQuorumCheckLimit = 0
    MaxCrashLimit = 0
    MaxLoseLimit = 0
    MaxMsgBufferLimit = 12
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    MsgVote = MsgVote
    MsgVoteResp = MsgVoteResp
    MsgApp = MsgApp
    MsgAppResp = MsgAppResp
    MsgHeartbeat = MsgHeartbeat
    MsgHeartbeatResp = MsgHeartbeatResp
    MsgReadIndex = MsgReadIndex
    MsgReadIndexResp = MsgReadIndexResp

CONSTRAINT StateConstraint
SYMMETRY ModelSymmetry
VIEW MCView

INVARIANTS
    MCTypeOK
    MCElectionSafety
    MCCommitWithinLog
    MCLogMatching
    MCCommittedPrefixAgreement
    MCLeaderCompleteness
    MCMessagesWellFormed
    MCReadDeliveryJustified
    MCReadyNoInvention
    PendingMatchesQueue
    ReadQueueDistinct
    ReadIndexFreshness
