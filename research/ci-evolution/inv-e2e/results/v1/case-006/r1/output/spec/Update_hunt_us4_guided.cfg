\* Guided BFS hunt for US4 over complete MCNext (Update.tla): CONSTRAINT US4Guide
\* prunes exploration only; faults zeroed to spend the budget on the scenario.
\* Targets ReadIndexFreshness (US4); ReadDeliveryJustifiedFresh (US3) is hunted
\* separately so TLC does not stop at the mechanism-level violation first.
SPECIFICATION MCSpec
CHECK_DEADLOCK FALSE

CONSTANTS
    Server = {s1, s2, s3}
    Values = {v1}
    ReadContexts = {ctx1}
    MaxTerm = 2
    MaxLogLen = 2
    MaxCampaignLimit = 2
    MaxProposalLimit = 0
    MaxHeartbeatLimit = 0
    MaxReadLimit = 2
    MaxReadyLimit = 14
    MaxQuorumCheckLimit = 0
    MaxCrashLimit = 0
    MaxLoseLimit = 0
    MaxMsgBufferLimit = 12
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    MsgVote = MsgVote
    MsgVoteResp = MsgVoteResp
    MsgApp = MsgApp
    MsgAppResp = MsgAppResp
    MsgHeartbeat = MsgHeartbeat
    MsgHeartbeatResp = MsgHeartbeatResp
    MsgReadIndex = MsgReadIndex
    MsgReadIndexResp = MsgReadIndexResp

CONSTRAINT US4Guide
SYMMETRY ModelSymmetry
VIEW MCView

INVARIANTS
    MCTypeOK
    MCElectionSafety
    MCCommitWithinLog
    MCLogMatching
    MCCommittedPrefixAgreement
    MCLeaderCompleteness
    MCMessagesWellFormed
    MCReadDeliveryJustified
    MCReadyNoInvention
    PendingMatchesQueue
    ReadQueueDistinct
    ReadIndexFreshness
