\* Update full check: update properties over complete MCNext (run on Update.tla).
\* Two reads (same context) so a released context can be enqueued again; two
\* campaigns/terms so a newer leader can commit; one crash, loss, quorum check.
SPECIFICATION MCSpec
CHECK_DEADLOCK FALSE

CONSTANTS
    Server = {s1, s2, s3}
    Values = {v1}
    ReadContexts = {ctx1}
    MaxTerm = 2
    MaxLogLen = 2
    MaxCampaignLimit = 2
    MaxProposalLimit = 0
    MaxHeartbeatLimit = 1
    MaxReadLimit = 2
    MaxReadyLimit = 8
    MaxQuorumCheckLimit = 1
    MaxCrashLimit = 1
    MaxLoseLimit = 1
    MaxMsgBufferLimit = 8
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    MsgVote = MsgVote
    MsgVoteResp = MsgVoteResp
    MsgApp = MsgApp
    MsgAppResp = MsgAppResp
    MsgHeartbeat = MsgHeartbeat
    MsgHeartbeatResp = MsgHeartbeatResp
    MsgReadIndex = MsgReadIndex
    MsgReadIndexResp = MsgReadIndexResp

CONSTRAINT StateConstraint
SYMMETRY ModelSymmetry
VIEW MCView

INVARIANTS
    MCTypeOK
    MCElectionSafety
    MCCommitWithinLog
    MCLogMatching
    MCCommittedPrefixAgreement
    MCLeaderCompleteness
    MCMessagesWellFormed
    MCReadDeliveryJustified
    MCReadyNoInvention
    PendingMatchesQueue
    ReadQueueDistinct
    ReadDeliveryJustifiedFresh
    ReadIndexFreshness
