\* Code observation for US4: ReadIndexFreshness alone on the replayed trace.
SPECIFICATION TraceSpec

CONSTANTS
    Server = {"s1", "s2", "s3"}
    Values = {"v1"}
    ReadContexts = {"ctx1"}
    Nil = "Nil"
    MaxTerm = 3
    MaxLogLen = 4
    Follower = "Follower"
    Candidate = "Candidate"
    Leader = "Leader"
    MsgVote = "MsgVote"
    MsgVoteResp = "MsgVoteResp"
    MsgApp = "MsgApp"
    MsgAppResp = "MsgAppResp"
    MsgHeartbeat = "MsgHeartbeat"
    MsgHeartbeatResp = "MsgHeartbeatResp"
    MsgReadIndex = "MsgReadIndex"
    MsgReadIndexResp = "MsgReadIndexResp"
    TraceFile = "../traces/stale_read.ndjson"

CHECK_DEADLOCK FALSE

INVARIANTS
    TraceCanProgress
    TraceTypeOK
    ElectionSafety
    CommitWithinLog
    LogMatching
    CommittedPrefixAgreement
    LeaderCompleteness
    MessagesWellFormed
    ReadDeliveryJustified
    ReadyNoInvention
    PendingMatchesQueue
    ReadQueueDistinct
    ReadIndexFreshness

PROPERTIES
    TraceMatched
