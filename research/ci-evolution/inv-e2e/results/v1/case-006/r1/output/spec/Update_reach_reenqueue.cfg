\* Reachability canary over full MCSpec (run on Update.tla): an invariant
\* violation of HuntReadReenqueue is the expected witness, not a bug.
SPECIFICATION MCSpec
CHECK_DEADLOCK FALSE

CONSTANTS
    Server = {s1, s2, s3}
    Values = {v1}
    ReadContexts = {ctx1}
    MaxTerm = 1
    MaxLogLen = 2
    MaxCampaignLimit = 1
    MaxProposalLimit = 0
    MaxHeartbeatLimit = 0
    MaxReadLimit = 2
    MaxReadyLimit = 6
    MaxQuorumCheckLimit = 0
    MaxCrashLimit = 0
    MaxLoseLimit = 0
    MaxMsgBufferLimit = 8
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    MsgVote = MsgVote
    MsgVoteResp = MsgVoteResp
    MsgApp = MsgApp
    MsgAppResp = MsgAppResp
    MsgHeartbeat = MsgHeartbeat
    MsgHeartbeatResp = MsgHeartbeatResp
    MsgReadIndex = MsgReadIndex
    MsgReadIndexResp = MsgReadIndexResp

CONSTRAINT StateConstraint
SYMMETRY ModelSymmetry
VIEW MCView

INVARIANTS
    MCTypeOK
    HuntReadReenqueue
