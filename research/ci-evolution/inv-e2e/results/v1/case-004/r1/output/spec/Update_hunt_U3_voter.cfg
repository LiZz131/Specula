\* Hunt U3: voter transfers (1->2 and back), commit by the new leader; deeper terms/logs. Targets are voters in every reachable config.
CONSTANTS
    Server = {1, 2, 3}
    NoNode = 0
    InitialVoters = {1, 2}
    MaxTerm = 3
    MaxIndex = 4
    ElectionLimit = 1
    TransferLimit = 2
    AppendLimit = 2
    MembershipLimit = 0
    CrashLimit = 0
    StaleLimit = 0
    ElectNodes = {1}
    TransferTargets = {1, 2}
    CrashNodes = {}

SPECIFICATION MCSpec

INVARIANTS
    MCTypeOK
    MCIOOrder
    MCCommitWithinAccepted
    MCMembershipOrder
    MCMembershipWellFormed
    MCLearnersExcluded
    MCCandidateGrantSound
    MCLeaderVoteCommitted
    MCMatchWithinLeaderLog
    MCDurableStateBounded
    MCCurrentTermCommit
    MCCommittedLogAgreement
    CandidateIsVoterOfSnapshot
    NoCorePanic

PROPERTIES
    ElectionInitiatorIsVoter
