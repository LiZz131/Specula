\* Replay configuration for RaftCore window traces from live memstore clusters
\* (node ids 0..3; openraft's default vote/log node id 0 is an ordinary value here,
\* so the model sentinel NoNode is moved out of the way).
CONSTANTS
    Server = {0, 1, 2, 3}
    NoNode = 99
    InitialVoters = {0, 1, 2}
    MaxTerm = 6
    MaxIndex = 12

SPECIFICATION TraceSpec
PROPERTIES TraceMatched
