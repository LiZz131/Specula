\* Canary: committed record recoverable on a re-synced peer after a SNAP exit (expected violation).
CONSTANTS
    Server = {s1, s2, s3}
    MaxEpoch = 1
    MaxTxn = 2
    NoServer = NoServer
    LearnerShutdownSemantics = "UPDATED"
    TrackCoverage = TRUE
    MaxRounds = 2
    MaxCrashes = 1
    MaxExits = 1
    MaxSnapshots = 0
SYMMETRY Symmetry
INIT SteadyInit
NEXT SnapScenarioNext
CHECK_DEADLOCK FALSE

INVARIANTS
    MCTypeOK
    SnapExitThenCommittedRecoverableUnreachable
