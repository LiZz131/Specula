\* RESIDUAL (U1-U4 excluded: their violations are attributed in the scenario hunts) UPDATE full: update properties over complete MCNext (two transactions, two learner exits).
CONSTANTS
    Server = {s1, s2, s3}
    MaxEpoch = 2
    MaxTxn = 2
    NoServer = NoServer
    LearnerShutdownSemantics = "UPDATED"
    TrackCoverage = FALSE
    MaxRounds = 2
    MaxCrashes = 1
    MaxExits = 2
    MaxSnapshots = 1
SYMMETRY Symmetry
INIT MCInit
NEXT MCNext
CHECK_DEADLOCK FALSE

INVARIANTS
    MCTypeOK
    ActiveLeaderUniqueness
    AcceptedEpochGECurrentEpoch
    OrderedHistoriesMem
    CommittedPrefixAgreement
    NormalAckHasDurabilityEvidence
    ApplyHasCommitCertificate
    SyncEntryJustified
    SnapshotPublishedValidV1
    ClearedOnlyAfterSnapExit

PROPERTIES
    MonotoneUnlessRecoveryUpd
