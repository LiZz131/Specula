\* UPD-1 (UPDATED): SNAP sync interrupted inside the sync window, reload, re-join. All core + update properties.
CONSTANTS
    Server = {s1, s2, s3}
    MaxEpoch = 1
    MaxTxn = 2
    NoServer = NoServer
    LearnerShutdownSemantics = "UPDATED"
    TrackCoverage = FALSE
    MaxRounds = 2
    MaxCrashes = 1
    MaxExits = 1
    MaxSnapshots = 0
SYMMETRY Symmetry
INIT SteadyInit
NEXT SnapScenarioNext
CHECK_DEADLOCK FALSE

INVARIANTS
    MCTypeOK
    ActiveLeaderUniqueness
    AcceptedEpochGECurrentEpoch
    OrderedHistoriesV1
    CommittedPrefixAgreement
    NormalAckHasDurabilityEvidence
    ApplyHasCommitCertificate
    SyncEntryJustified
    SnapshotPublishedValidV1
    ExitedLearnerMemoryBackedByLog
    RecoverableHistoryComplete
    RecoverableCommittedPrefix
    DurableReplayOrdered
    ClearedOnlyAfterSnapExit

PROPERTIES
    MonotoneUnlessRecoveryUpd
