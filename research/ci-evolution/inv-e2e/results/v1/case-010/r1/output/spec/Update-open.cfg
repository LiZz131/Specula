\* UPDATE open focused: concrete focus plus EnvUpdate (omitted context under the rely).
CONSTANTS
    Server = {s1, s2, s3}
    MaxEpoch = 2
    MaxTxn = 2
    NoServer = NoServer
    LearnerShutdownSemantics = "UPDATED"
    TrackCoverage = FALSE
    MaxRounds = 2
    MaxCrashes = 1
    MaxExits = 2
    MaxSnapshots = 1
SYMMETRY Symmetry
INIT SteadyInit
NEXT OpenUpdateNext
CHECK_DEADLOCK FALSE

INVARIANTS
    MCTypeOK
    ActiveLeaderUniqueness
    AcceptedEpochGECurrentEpoch
    OrderedHistoriesV1
    CommittedPrefixAgreement
    NormalAckHasDurabilityEvidence
    ApplyHasCommitCertificate
    SyncEntryJustified
    SnapshotPublishedValidV1
    ExitedLearnerMemoryBackedByLog
    RecoverableHistoryComplete
    RecoverableCommittedPrefix
    DurableReplayOrdered
    ClearedOnlyAfterSnapExit

PROPERTIES
    MonotoneUnlessRecoveryUpd
