\* CONTROL (core invariants only): replay of old-revision control traces against the PRIOR learner-shutdown semantics.
SPECIFICATION TraceSpec
VIEW TraceView
ALIAS TraceAlias
CHECK_DEADLOCK FALSE

CONSTANTS
    Server = {"s0", "s1", "s2"}
    MaxEpoch = 10
    MaxTxn = 40
    NoServer = "NoServer"
    LearnerShutdownSemantics = "PRIOR"

INVARIANTS
    TypeOK
    ActiveLeaderUniqueness
    AcceptedEpochGECurrentEpoch
    OrderedHistoriesV1
    CommittedPrefixAgreement
    NormalAckHasDurabilityEvidence
    ApplyHasCommitCertificate
    SyncEntryJustified
    SnapshotPublishedValidV1

PROPERTIES
    TraceMatched
