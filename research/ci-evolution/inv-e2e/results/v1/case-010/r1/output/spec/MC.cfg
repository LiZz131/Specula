\* Standard convergence: fault-free core protocol (prior MC.cfg role). Bounded; not proof.
CONSTANTS
    Server = {s1, s2, s3}
    MaxEpoch = 2
    MaxTxn = 1
    NoServer = NoServer
    LearnerShutdownSemantics = "UPDATED"
    TrackCoverage = FALSE
    MaxRounds = 2
    MaxCrashes = 1
    MaxExits = 1
    MaxSnapshots = 1
SYMMETRY Symmetry
INIT MCInit
NEXT MCCoreNext
CHECK_DEADLOCK FALSE

INVARIANTS
    MCTypeOK
    ActiveLeaderUniqueness
    AcceptedEpochGECurrentEpoch
    OrderedHistoriesV1
    CommittedPrefixAgreement
    NormalAckHasDurabilityEvidence
    ApplyHasCommitCertificate
    SyncEntryJustified
    SnapshotPublishedValidV1
    OrderedHistories

PROPERTIES
    MonotoneUnlessRecoveryV1
