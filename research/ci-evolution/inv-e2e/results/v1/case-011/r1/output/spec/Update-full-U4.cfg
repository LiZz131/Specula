\* Companion of Update-full.cfg with the precursor invariant U5 disabled, so the
\* consequence property U4 is checked over the complete MCNext.
\* Full update check: update properties over the complete MCNext (all
\* reference actions, runtime pre-vote flag may take either value).
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 2
    MaxLogIndex = 4
    PreVoteSetting <- ReferencePreVoteSetting
    MaxElectionCount = 2
    MaxPreVoteCount = 2
    MaxMembershipCount = 2
    MaxCrashCount = 1
    MaxDropCount = 1
    MaxMessageCount = 5

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK
    \* unaffected core safety controls
    DurableVoteNotAhead
    VoteRequestAfterDurable
    GrantedResponseAfterDurable
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    CertifiedLeaderHasFrozenQuorum
    \* update properties (state)
    PreCandidateVoteIsNextTerm

PROPERTIES
    PreVoteElectsProbedVote
    PreVoteRequestPure
    PreVoteNeverDemotesLeader
