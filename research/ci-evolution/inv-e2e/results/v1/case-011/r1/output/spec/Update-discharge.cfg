\* Discharge: every omitted membership step of the complete MC model satisfies
\* the rely EnvUpdate with its frame (MCAppendJointConfig, MCAppendUniformConfig,
\* CommitMembership).
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 2
    MaxLogIndex = 4
    PreVoteSetting <- ReferencePreVoteSetting
    MaxElectionCount = 2
    MaxPreVoteCount = 2
    MaxMembershipCount = 2
    MaxCrashCount = 1
    MaxDropCount = 1
    MaxMessageCount = 5

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK

PROPERTIES
    DischargeContext
