\* Scenario U-S2/U-S3 hunt: probe/election term agreement and pre-vote purity
\* under crash, loss, transfer and runtime flag toggling.
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 2
    MaxLogIndex = 4
    PreVoteSetting <- ReferencePreVoteSetting
    MaxElectionCount = 2
    MaxPreVoteCount = 2
    MaxMembershipCount = 0
    MaxCrashCount = 1
    MaxDropCount = 1
    MaxMessageCount = 5

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK
    DurableVoteNotAhead
    LeaderRoleHasCommittedSelfVote
    PreCandidateVoteIsNextTerm

PROPERTIES
    PreVoteElectsProbedVote
    PreVoteRequestPure
