\* Companion of Update-open.cfg with the already-violated U4/U5 (finding MC-1) disabled so
\* that U1-U3 and the core controls are explored past that violation.
\* Open focused check: AffectedActions \/ InteractionActions \/ EnvUpdate
\* (membership evolution replaced by the rely EnvUpdate).
SPECIFICATION OpenUpdateSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 2
    MaxLogIndex = 4
    PreVoteSetting <- ReferencePreVoteSetting
    MaxElectionCount = 2
    MaxPreVoteCount = 2
    MaxMembershipCount = 2
    MaxCrashCount = 1
    MaxDropCount = 1
    MaxMessageCount = 5

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK
    \* unaffected core safety controls
    DurableVoteNotAhead
    VoteRequestAfterDurable
    GrantedResponseAfterDurable
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    CertifiedLeaderHasFrozenQuorum
    \* update properties (state)
    PreCandidateVoteIsNextTerm

PROPERTIES
    PreVoteElectsProbedVote
    PreVoteRequestPure
