\* Scenario U-S4 hunt: Pre-Vote permanently enabled (Config::enable_pre_vote =
\* Some(true)); no direct/administrative elections, no membership change,
\* no crash, no drop. Only tick-driven Pre-Vote rounds start elections.
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 2
    MaxLogIndex = 4
    PreVoteSetting <- PreVoteAlwaysOn
    MaxElectionCount = 0
    MaxPreVoteCount = 2
    MaxMembershipCount = 0
    MaxCrashCount = 0
    MaxDropCount = 0
    MaxMessageCount = 5

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote

PROPERTIES
    PreVoteNeverDemotesLeader
