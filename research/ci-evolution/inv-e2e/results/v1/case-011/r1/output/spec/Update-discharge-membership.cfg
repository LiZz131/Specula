\* Discharge companion seeded with a single voter so that membership evolution
\* is reached early (the 3-voter seed needs an election before any append).
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig = {"1"}
    MaxTerm = 2
    MaxLogIndex = 4
    PreVoteSetting <- ReferencePreVoteSetting
    MaxElectionCount = 1
    MaxPreVoteCount = 1
    MaxMembershipCount = 2
    MaxCrashCount = 1
    MaxDropCount = 1
    MaxMessageCount = 4

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK

PROPERTIES
    DischargeContext
