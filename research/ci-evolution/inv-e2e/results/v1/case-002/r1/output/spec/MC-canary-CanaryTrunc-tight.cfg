\* Reachability canary for TRUNC with tight bounds (single epoch, no faults): late rejoin of a learner holding an uncommitted record.
SPECIFICATION MCSpec
CONSTANTS
    Server = {s1, s2, s3}
    Txn = {t1}
    MaxEpoch = 1
    Nil = Nil
    MaxCrash = 0
    MaxDrop = 0
    MaxSnapshot = 0
    MaxDepth = 200
CHECK_DEADLOCK FALSE
SYMMETRY ModelSymmetry
INVARIANTS
    CanaryTrunc
