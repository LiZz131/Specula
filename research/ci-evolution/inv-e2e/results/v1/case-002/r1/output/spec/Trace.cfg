\* Action-based trace validation. Select a trace with JSON=<path> in the environment.
SPECIFICATION TraceSpec
CONSTANTS
    Server <- TraceServers
    Txn <- TraceTxns
    MaxEpoch <- TraceMaxEpoch
    Nil = Nil
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    ElectionSafety
    OneActiveLeaderPerEpoch
    CommittedHistoriesPrefix
    ServingApplyCommitted
    PipelinePrefix
    EpochHistoryConsistency
    SyncCompletionJustified
PROPERTIES
    TraceMatched
    HistoryPositionsMonotonicExceptRecovery
