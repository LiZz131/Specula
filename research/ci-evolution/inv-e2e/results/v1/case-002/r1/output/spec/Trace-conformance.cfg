\* Conformance-only replay for traces that exhibit an implementation safety violation
\* (reproduction scenario): every event still drives the reference actions with all
\* post-state checks; only the protocol safety invariants are evaluated separately
\* (TraceUpdateEvidence*.cfg, Trace.cfg) and recorded as findings evidence.
SPECIFICATION TraceSpec
