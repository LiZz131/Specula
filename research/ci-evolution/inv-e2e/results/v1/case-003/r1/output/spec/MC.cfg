\* Standard convergence config (V1): reference safety + structural invariants.
\* Update-specific properties live in Update.tla / Update_*.cfg.
SPECIFICATION MCSpec

CONSTANTS
    MaxHeight = 2
    MaxBlocks = 2
    MaxCrashes = 2
    MaxAppRollbacks = 1
    Others = {"o0", "oBad"}
    ValidOthers = {"o0"}
    VEHeights <- VEHRangeNeg3
    InitialOthers = {"o0"}
    InitialVEHs = {0, 1, 2}

INVARIANTS
    \* structural
    MCTypeOK
    InstalledParamsBasicValid
    ValidationInputStable
    \* reference safety (V0 properties, re-justified for V1)
    PersistedHeightRelationships
    SuccessfulApplyAdvancesExactlyOne
    RejectedUpdateDoesNotInstall
    ParameterUpdateReflected
    NormalPhaseIsSynchronized
    RecoveryNormalOnlySupported
    \* update-scenario invariants are enabled in Update_*.cfg, not here:
    \* VEReachedImmutable, VEChangeOnlyToFuture,
    \* EnableFromDisabledNotRejected, UnchangedVENotRejected
