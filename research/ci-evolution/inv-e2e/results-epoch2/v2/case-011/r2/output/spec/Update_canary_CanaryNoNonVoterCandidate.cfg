    InitialConfig <- PairServer
    MaxTerm = 2
    MaxLogIndex = 3
    EnablePreVote = TRUE
    PreVoteDefaultGrant = FALSE
    MaxElectionCount = 1
    MaxPreVoteCount = 1
    MaxMembershipCount = 2
    MaxCrashCount = 0
    MaxDropCount = 0
    MaxMessageCount = 5

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    CanaryNoNonVoterCandidate
