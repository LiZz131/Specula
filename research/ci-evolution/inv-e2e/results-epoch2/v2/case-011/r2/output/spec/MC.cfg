\* Standard convergence configuration for the updated reference.
\* Product default: Config::enable_pre_vote = None -> disabled
\* (config.rs get_enable_pre_vote), so the tick elects directly; the per-call
\* external pre-vote trigger (trigger().elect(true)) stays available.
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 2
    MaxLogIndex = 4
    EnablePreVote = FALSE
    PreVoteDefaultGrant = FALSE

    MaxElectionCount = 2
    MaxPreVoteCount = 1
    MaxMembershipCount = 2
    MaxCrashCount = 1
    MaxDropCount = 1
    MaxMessageCount = 5

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK

    \* Core safety and persistence ordering
    DurableVoteNotAhead
    DurableLogNotAhead
    VoteRequestAfterDurable
    GrantedResponseAfterDurable
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    MembershipAtMostOneOutstanding
    NoForgedMessageEndpoints
    CertifiedLeaderHasFrozenQuorum
    PreCandidateWellFormed

    \* Update-specific properties live in Update.tla and are checked by the
    \* Update_*.cfg campaigns, not by this standard convergence round.
