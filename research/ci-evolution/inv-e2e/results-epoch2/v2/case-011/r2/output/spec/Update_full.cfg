\* Update properties over the complete MCNext (guard against interactions
\* omitted by focused models). enable_pre_vote = true.
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 2
    MaxLogIndex = 4
    EnablePreVote = TRUE
    PreVoteDefaultGrant = FALSE
    MaxElectionCount = 2
    MaxPreVoteCount = 2
    MaxMembershipCount = 2
    MaxCrashCount = 1
    MaxDropCount = 1
    MaxMessageCount = 5

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK
    DurableVoteNotAhead
    DurableLogNotAhead
    VoteRequestAfterDurable
    GrantedResponseAfterDurable
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    CertifiedLeaderHasFrozenQuorum
    MembershipAtMostOneOutstanding
    NoForgedMessageEndpoints
    PreCandidateWellFormed
    \* update properties
    TickPreVoteRoundNotHeldByLeader
    PreVoteGrantsWithinFrozenVoters
    CandidateGrantsWithinFrozenVoters

PROPERTIES
    LeaderNotPreemptedByTimerPreVote
    PreVoteElectionAtProbedVote
    PreVoteStepsDoNotPersist
