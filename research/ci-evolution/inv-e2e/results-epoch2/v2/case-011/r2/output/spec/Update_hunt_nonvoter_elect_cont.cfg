\* Scenario U3: a pre-vote round outlives a membership change that removes its node
\* from the voters; the round then completes and do_elect runs for a non-voter.
\* Two-node universe so that the joint+uniform evolution fits the bounds.
SPECIFICATION MCSpec

CONSTANTS
    Server <- PairServer
    NodeOrder <- PairNodeOrder
    InitialConfig <- PairServer
    MaxTerm = 2
    MaxLogIndex = 3
    EnablePreVote = TRUE
    PreVoteDefaultGrant = FALSE
    MaxElectionCount = 1
    MaxPreVoteCount = 1
    MaxMembershipCount = 2
    MaxCrashCount = 0
    MaxDropCount = 0
    MaxMessageCount = 5

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK
    DurableVoteNotAhead
    DurableLogNotAhead
    VoteRequestAfterDurable
    GrantedResponseAfterDurable
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    CertifiedLeaderHasFrozenQuorum
    MembershipAtMostOneOutstanding
    NoForgedMessageEndpoints
    PreCandidateWellFormed
    \* update properties
    \* TickPreVoteRoundNotHeldByLeader  (known MC-1; filtered in this follow-up run)
    PreVoteGrantsWithinFrozenVoters
    CandidateGrantsWithinFrozenVoters

PROPERTIES
    \* LeaderNotPreemptedByTimerPreVote  (known MC-1; filtered in this follow-up run)
    PreVoteElectionAtProbedVote
    PreVoteStepsDoNotPersist
