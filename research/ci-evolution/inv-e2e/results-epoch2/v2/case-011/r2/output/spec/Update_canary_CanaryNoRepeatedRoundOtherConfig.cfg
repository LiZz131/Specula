\* Reachability canary: a violation of CanaryNoRepeatedRoundOtherConfig is the expected witness.
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 2
    MaxLogIndex = 3
    EnablePreVote = TRUE
    PreVoteDefaultGrant = FALSE
    MaxElectionCount = 1
    MaxPreVoteCount = 2
    MaxMembershipCount = 2
    MaxCrashCount = 0
    MaxDropCount = 0
    MaxMessageCount = 6

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    CanaryNoRepeatedRoundOtherConfig
