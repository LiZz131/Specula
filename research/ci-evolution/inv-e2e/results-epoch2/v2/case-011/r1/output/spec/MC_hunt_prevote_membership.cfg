\* Scenario U3 hunt: Pre-Vote rounds interleaved with joint/uniform membership evolution on the leader (frozen pre-candidate quorum vs. current effective membership). Run with module Update.
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 2
    MaxLogIndex = 4
    PreVoteTickModes = {TRUE}
    PreVoteRpcDefaultGrant = FALSE

    MaxElectionCount = 1
    MaxMembershipCount = 2
    MaxCrashCount = 0
    MaxDropCount = 0
    MaxMessageCount = 6
    MaxPreVoteCount = 2

CONSTRAINT MessageBound
VIEW UpdateView

INVARIANTS
    MCTypeOK
    DurableVoteNotAhead
    DurableLogNotAhead
    VoteRequestAfterDurable
    GrantedResponseAfterDurable
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    MembershipAtMostOneOutstanding
    NoForgedMessageEndpoints
    CertifiedLeaderHasFrozenQuorum
    \* Implementation-asserted invariant; see Update.tla note (operator elect on a leader also reaches it).
    LeaderObjectVoteNotBehind

PROPERTIES
    PreVoteRoundNotOutlivedByOwnLeadership
    PreVoteElectionByVoter
    PreVoteElectionAtProbedVote
    PreVoteRequestIsPure
    PreVoteStartIsPure
    PreVoteGrantFromTrackedVoter
