\* FILTERED variant (ACTION_CONSTRAINT KnownFindingsFilter: MC-1 and the pre-existing operator elect-on-leader path are pruned). Scenario U3 hunt: Pre-Vote rounds interleaved with joint/uniform membership evolution on the leader (frozen pre-candidate quorum vs. current effective membership). Run with module Update.
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 2
    MaxLogIndex = 4
    PreVoteTickModes = {TRUE}
    PreVoteRpcDefaultGrant = FALSE

    MaxElectionCount = 1
    MaxMembershipCount = 2
    MaxCrashCount = 0
    MaxDropCount = 0
    MaxMessageCount = 6
    MaxPreVoteCount = 2

CONSTRAINT MessageBound
ACTION_CONSTRAINT KnownFindingsFilter
VIEW UpdateView

INVARIANTS
    MCTypeOK
    DurableVoteNotAhead
    DurableLogNotAhead
    VoteRequestAfterDurable
    GrantedResponseAfterDurable
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    MembershipAtMostOneOutstanding
    NoForgedMessageEndpoints
    CertifiedLeaderHasFrozenQuorum
    \* LeaderObjectVoteNotBehind: analyzed (MC-1, CR-PRE-1); disabled in this filtered variant

PROPERTIES
    \* PreVoteRoundNotOutlivedByOwnLeadership: analyzed (MC-1); disabled in this filtered variant
    \* PreVoteElectionByVoter: violated (unresolved, status unknown; output/D-2_PreVoteElectionByVoter_*.out); disabled to keep hunting
    PreVoteElectionAtProbedVote
    PreVoteRequestIsPure
    PreVoteStartIsPure
    PreVoteGrantFromTrackedVoter
