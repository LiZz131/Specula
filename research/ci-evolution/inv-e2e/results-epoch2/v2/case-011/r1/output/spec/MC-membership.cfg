\* Single-voter seed is a bounded non-vacuity companion to MC.cfg. It makes
\* election establishment deterministic enough to exercise both coherent
\* membership phases while retaining two other nodes as possible targets.
\* With one voter, Engine::pre_elect self-grants a quorum and elects at once.
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig = {"1"}
    MaxTerm = 2
    MaxLogIndex = 4
    PreVoteTickModes = {FALSE, TRUE}
    PreVoteRpcDefaultGrant = FALSE

    MaxElectionCount = 1
    MaxMembershipCount = 2
    MaxCrashCount = 1
    MaxDropCount = 1
    MaxMessageCount = 4
    MaxPreVoteCount = 1

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK
    DurableVoteNotAhead
    DurableLogNotAhead
    VoteRequestAfterDurable
    GrantedResponseAfterDurable
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    CertifiedLeaderHasFrozenQuorum
    MembershipAtMostOneOutstanding
    NoForgedMessageEndpoints
