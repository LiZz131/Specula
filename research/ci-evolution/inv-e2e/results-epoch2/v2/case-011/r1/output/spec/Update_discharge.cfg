\* Discharge: every FlushLog step of the full MCNext satisfies EnvUpdate's
\* EnvDurability rely with its frame (including faultCounters).
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 2
    MaxLogIndex = 4
    PreVoteTickModes = {FALSE, TRUE}
    PreVoteRpcDefaultGrant = FALSE

    MaxElectionCount = 2
    MaxMembershipCount = 2
    MaxCrashCount = 1
    MaxDropCount = 1
    MaxMessageCount = 5
    MaxPreVoteCount = 2

CONSTRAINT MessageBound
VIEW UpdateView

INVARIANTS
    MCTypeOK

PROPERTIES
    DischargeFlushLog
