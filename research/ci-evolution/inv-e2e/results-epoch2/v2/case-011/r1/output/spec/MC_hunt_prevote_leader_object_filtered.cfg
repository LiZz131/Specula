\* FILTERED variant (ACTION_CONSTRAINT KnownFindingsFilter: MC-1 and the pre-existing operator elect-on-leader path are pruned). Scenario U2 hunt (leader object): elections only through Pre-Vote (MaxElectionCount = 0; Pre-Vote tick only), so a Leader object behind the local vote can only come from the update path. Run with module Update.
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 2
    MaxLogIndex = 4
    PreVoteTickModes = {TRUE}
    PreVoteRpcDefaultGrant = FALSE

    MaxElectionCount = 0
    MaxMembershipCount = 0
    MaxCrashCount = 1
    MaxDropCount = 1
    MaxMessageCount = 6
    MaxPreVoteCount = 3

CONSTRAINT MessageBound
ACTION_CONSTRAINT KnownFindingsFilter
VIEW UpdateView

INVARIANTS
    MCTypeOK
    DurableVoteNotAhead
    DurableLogNotAhead
    VoteRequestAfterDurable
    GrantedResponseAfterDurable
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    MembershipAtMostOneOutstanding
    NoForgedMessageEndpoints
    CertifiedLeaderHasFrozenQuorum
    \* LeaderObjectVoteNotBehind: analyzed (MC-1, CR-PRE-1); disabled in this filtered variant

PROPERTIES
    \* PreVoteRoundNotOutlivedByOwnLeadership: analyzed (MC-1); disabled in this filtered variant
    PreVoteElectionByVoter
    PreVoteElectionAtProbedVote
    PreVoteRequestIsPure
    PreVoteStartIsPure
    PreVoteGrantFromTrackedVoter
