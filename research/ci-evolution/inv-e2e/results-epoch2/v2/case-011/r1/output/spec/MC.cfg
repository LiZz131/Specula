\* Standard reference convergence configuration for the updated suite.
\* PreVoteTickModes = {FALSE, TRUE}: the election tick may run either the
\* direct election or a Pre-Vote round (RuntimeConfigHandle::pre_vote toggle);
\* ExternalCommand::Elect may request either form in every configuration.
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 2
    MaxLogIndex = 4
    PreVoteTickModes = {FALSE, TRUE}
    PreVoteRpcDefaultGrant = FALSE

    MaxElectionCount = 2
    MaxMembershipCount = 2
    MaxCrashCount = 1
    MaxDropCount = 1
    MaxMessageCount = 5
    MaxPreVoteCount = 2

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK

    \* Core safety and persistence ordering
    DurableVoteNotAhead
    DurableLogNotAhead
    VoteRequestAfterDurable
    GrantedResponseAfterDurable
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    MembershipAtMostOneOutstanding
    NoForgedMessageEndpoints

    \* Neutral scenario property (kept from V0).
    CertifiedLeaderHasFrozenQuorum

\* Update-specific properties are enabled through Update.tla configs
\* (Update_full.cfg, Update_focused.cfg, Update_open.cfg, MC_hunt_*.cfg).
