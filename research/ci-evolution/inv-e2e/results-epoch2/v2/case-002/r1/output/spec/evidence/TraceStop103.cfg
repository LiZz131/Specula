SPECIFICATION TraceSpec

CONSTANTS
    Server = {"s0", "s1", "s2"}
    Txn = {0, 1, 2, 3, 4, 5, 6, 7, 1000}
    MaxEpoch = 3
    Nil = "Nil"

CHECK_DEADLOCK FALSE

\* OneActiveLeaderPerEpoch is not enabled here: at trace granularity FLE sets
\* role LEADING before Leader.getEpochToPropose advances the accepted epoch, so
\* a stale and a new LEADING peer briefly share the old accepted epoch
\* (diff-sync-uncommitted-log seq 98-105).  It stays enabled in every MC cfg,
\* where WinElection is atomic; ElectionSafety (leadersByEpoch) is checked here.
INVARIANTS
    StopAt103
    TypeOK
    ElectionSafety
    CommittedHistoriesPrefix
    ApplyRequiresCommitCertificate
    PipelinePrefix
    EpochHistoryConsistency
    SyncCompletionJustified



