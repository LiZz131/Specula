SPECIFICATION UpdLostCommitSpec

CONSTANTS
    Server = {s1, s2, s3}
    Txn = {t1}
    MaxEpoch = 3
    Nil = Nil
    MaxCrash = 1
    MaxDrop = 0
    MaxSnapshot = 0

CHECK_DEADLOCK FALSE
SYMMETRY ModelSymmetry

\* UpdNewLeaderAckAfterDurable and UpdEstablishedHistoryDurableOnQuorum already
\* have analyzed counterexamples (upd-hunt-diff-ack-r1/r2); they are disabled
\* here so the end-to-end consequence (UpdLeaderCompleteness) is explored.
INVARIANTS
    TypeOK
    MCTypeOK
    UpdGhostTypeOK
    ElectionSafety
    OneActiveLeaderPerEpoch
    CommittedHistoriesPrefix
    ApplyRequiresCommitCertificate
    PipelinePrefix
    EpochHistoryConsistency
    SyncCompletionJustified
    UpdLeaderCompleteness

PROPERTIES
    HistoryPositionsMonotonicExceptRecovery
