\* Two-server variant of Update-hunt-durable.cfg (quorum 2): quick confirmation of the U2 window on the final model.
SPECIFICATION UpdateFocusedSpec

CONSTANTS
    Server = {s1, s2}
    Txn = {t1}
    MaxEpoch = 2
    Nil = Nil
    MaxCrash = 0
    MaxDrop = 0
    MaxSnapshot = 0

CHECK_DEADLOCK FALSE
SYMMETRY UpdateSymmetry

INVARIANTS
    TypeOK
    MCTypeOK
    ElectionSafety
    OneActiveLeaderPerEpoch
    CommittedHistoriesPrefix
    ApplyRequiresCommitCertificate
    PipelinePrefix
    EpochHistoryConsistency
    SyncCompletionJustified
    UTypeOK
    CommittedQuorumDurable
    CommittedNeverLostByLeader
    NewLeaderAckAfterLogging

PROPERTIES
    HistoryPositionsMonotonicExceptRecovery
