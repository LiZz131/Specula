\* Continuation of Update-open.cfg after its CommittedQuorumDurable counterexample: same
\* bounds and properties except CommittedQuorumDurable (bug-hunting rule: keep
\* exploring the same config with the found property disabled).
SPECIFICATION OpenUpdateSpec

CONSTANTS
    Server = {s1, s2, s3}
    Txn = {t1}
    MaxEpoch = 2
    Nil = Nil
    MaxCrash = 1
    MaxDrop = 1
    MaxSnapshot = 1

CHECK_DEADLOCK FALSE
SYMMETRY UpdateSymmetry

INVARIANTS
    TypeOK
    MCTypeOK
    ElectionSafety
    OneActiveLeaderPerEpoch
    CommittedHistoriesPrefix
    ApplyRequiresCommitCertificate
    PipelinePrefix
    EpochHistoryConsistency
    SyncCompletionJustified
    UTypeOK
    CommittedNeverLostByLeader
    NewLeaderAckAfterLogging

PROPERTIES
    HistoryPositionsMonotonicExceptRecovery
