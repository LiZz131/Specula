    Server = {s1, s2, s3}
    Txn = {t1}
    MaxEpoch = 2
    Nil = Nil
    MaxCrash = 1
    MaxDrop = 1
    MaxSnapshot = 1

CHECK_DEADLOCK FALSE
SYMMETRY UpdateSymmetry

INVARIANTS
    TypeOK
    MCTypeOK
    ElectionSafety
    OneActiveLeaderPerEpoch
    CommittedHistoriesPrefix
    ApplyRequiresCommitCertificate
    PipelinePrefix
    EpochHistoryConsistency
    SyncCompletionJustified
    UTypeOK
    CommittedQuorumDurable
    CommittedNeverLostByLeader
    NewLeaderAckAfterLogging

PROPERTIES
    HistoryPositionsMonotonicExceptRecovery
