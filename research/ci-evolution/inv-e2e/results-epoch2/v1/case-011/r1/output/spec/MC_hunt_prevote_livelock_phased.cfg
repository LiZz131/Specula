\* Scenario U-S2 phased directed BFS: livelock hunt + LivelockDirectorPhased monitor,
\* MaxTerm 2, MaxLogIndex 2, no drops (pruning only; witness search, not an absence proof).
SPECIFICATION MCSpec
CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 2
    MaxLogIndex = 2
    TickPreVoteModes = {TRUE}
    MaxElectionCount = 2
    MaxExternalCount = 0
    MaxMembershipCount = 0
    MaxCrashCount = 1
    MaxRestartCount = 0
    MaxDropCount = 0
    MaxMessageCount = 6
CONSTRAINT MessageBound LivelockDirectorPhased
VIEW ModelView
INVARIANTS
    MCTypeOK
    DurableVoteNotAhead
    DurableLogNotAhead
    VoteRequestAfterDurable
    GrantedResponseAfterDurable
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    CertifiedLeaderHasFrozenQuorum
    MembershipAtMostOneOutstanding
    NoForgedMessageEndpoints
    PreCandidateProbesNextTerm
    NoPermanentPreVoteLivelock
PROPERTIES
    LivelockClosed
