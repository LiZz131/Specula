\* Open focused check: membership evolution replaced by EnvUpdate.
SPECIFICATION OpenSpec
CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 3
    MaxLogIndex = 4
    TickPreVoteModes = {TRUE}
    MaxElectionCount = 3
    MaxExternalCount = 0
    MaxMembershipCount = 1
    MaxCrashCount = 1
    MaxRestartCount = 1
    MaxDropCount = 1
    MaxMessageCount = 6
CONSTRAINT MessageBound
VIEW ModelView
INVARIANTS
    MCTypeOK
    DurableVoteNotAhead
    DurableLogNotAhead
    VoteRequestAfterDurable
    GrantedResponseAfterDurable
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    CertifiedLeaderHasFrozenQuorum
    MembershipAtMostOneOutstanding
    NoForgedMessageEndpoints
    PreCandidateProbesNextTerm
    NoPermanentPreVoteLivelock
PROPERTIES
    PreVoteQuorumNeverDemotesLeader
