\* Scenario U-S2 directed hunt (simulation): same as MC_hunt_prevote_livelock.cfg with
\* unrelated domains reduced (MaxTerm 2, MaxLogIndex 2, no drops); the update and
\* fault actions of the Scenario are unchanged. Witness search only (not absence proof).
SPECIFICATION MCSpec
CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 2
    MaxLogIndex = 2
    TickPreVoteModes = {TRUE}
    MaxElectionCount = 2
    MaxExternalCount = 0
    MaxMembershipCount = 0
    MaxCrashCount = 1
    MaxRestartCount = 0
    MaxDropCount = 0
    MaxMessageCount = 6
CONSTRAINT MessageBound
VIEW ModelView
INVARIANTS
    MCTypeOK
    DurableVoteNotAhead
    DurableLogNotAhead
    VoteRequestAfterDurable
    GrantedResponseAfterDurable
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    CertifiedLeaderHasFrozenQuorum
    MembershipAtMostOneOutstanding
    NoForgedMessageEndpoints
    PreCandidateProbesNextTerm
    NoPermanentPreVoteLivelock
PROPERTIES
    LivelockClosed
