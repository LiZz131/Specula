\* Standard full reference check (convergence round). Pre-Vote may be on or
\* off at each tick: Raft::runtime_config().pre_vote(bool) toggles it at
\* runtime (raft/runtime_config_handle.rs:51-53), and an operator may call
\* trigger().elect(pre_vote) with either value (raft/trigger.rs:61-63).
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 2
    MaxLogIndex = 4
    TickPreVoteModes = {TRUE, FALSE}

    MaxElectionCount = 2
    MaxExternalCount = 1
    MaxMembershipCount = 2
    MaxCrashCount = 1
    MaxRestartCount = 1
    MaxDropCount = 1
    MaxMessageCount = 5

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK

    \* Core safety and persistence ordering
    DurableVoteNotAhead
    DurableLogNotAhead
    VoteRequestAfterDurable
    GrantedResponseAfterDurable
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    MembershipAtMostOneOutstanding
    NoForgedMessageEndpoints

    \* Neutral scenario property kept from V0
    CertifiedLeaderHasFrozenQuorum
