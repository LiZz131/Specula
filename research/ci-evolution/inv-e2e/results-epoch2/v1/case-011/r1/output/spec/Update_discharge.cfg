\* Discharge: every real membership step satisfies EnvUpdate (full MCSpec).
SPECIFICATION MCSpec
CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 2
    MaxLogIndex = 4
    TickPreVoteModes = {TRUE, FALSE}
    MaxElectionCount = 2
    MaxExternalCount = 1
    MaxMembershipCount = 2
    MaxCrashCount = 1
    MaxRestartCount = 1
    MaxDropCount = 1
    MaxMessageCount = 5
CONSTRAINT MessageBound
VIEW ModelView
INVARIANTS
    MCTypeOK
PROPERTIES
    DischargeContext
