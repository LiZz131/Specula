\* Scenario U-S2 directed BFS: MC_hunt_prevote_livelock.cfg plus the LivelockDirector
\* search monitor (prunes only). Witness search; a clean result is not an absence proof.
SPECIFICATION MCSpec
CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 3
    MaxLogIndex = 3
    TickPreVoteModes = {TRUE}
    MaxElectionCount = 2
    MaxExternalCount = 0
    MaxMembershipCount = 0
    MaxCrashCount = 1
    MaxRestartCount = 0
    MaxDropCount = 1
    MaxMessageCount = 6
CONSTRAINT MessageBound LivelockDirector
VIEW ModelView
INVARIANTS
    MCTypeOK
    DurableVoteNotAhead
    DurableLogNotAhead
    VoteRequestAfterDurable
    GrantedResponseAfterDurable
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    CertifiedLeaderHasFrozenQuorum
    MembershipAtMostOneOutstanding
    NoForgedMessageEndpoints
    PreCandidateProbesNextTerm
    NoPermanentPreVoteLivelock
PROPERTIES
    LivelockClosed
