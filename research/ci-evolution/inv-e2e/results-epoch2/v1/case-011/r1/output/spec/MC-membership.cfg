\* Single-voter seed (V0 non-vacuity companion), rebased: Pre-Vote on/off at
\* each tick. With one voter, tick and pre_elect both elect directly
\* (raft_core.rs:1987-2012, engine_impl.rs:309-315).
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig = {"1"}
    MaxTerm = 2
    MaxLogIndex = 4
    TickPreVoteModes = {TRUE, FALSE}

    MaxElectionCount = 1
    MaxExternalCount = 1
    MaxMembershipCount = 2
    MaxCrashCount = 1
    MaxRestartCount = 1
    MaxDropCount = 1
    MaxMessageCount = 4

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK
    DurableVoteNotAhead
    DurableLogNotAhead
    VoteRequestAfterDurable
    GrantedResponseAfterDurable
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    CertifiedLeaderHasFrozenQuorum
    MembershipAtMostOneOutstanding
    NoForgedMessageEndpoints
