\* Scenario U-5 hunt: stale Pre-Vote grant from a node outside the current round (membership changed between two rounds with the same correlation key).
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    TickPreVoteModes <- ReferenceTickPreVoteModes
    MaxTerm = 2
    MaxLogIndex = 4

    MaxElectionCount = 1
    MaxPreElectionCount = 2
    MaxMembershipCount = 2
    MaxCrashCount = 0
    MaxDropCount = 0
    MaxMessageCount = 5

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK
    DurableVoteNotAhead
    DurableLogNotAhead
    VoteRequestAfterDurable
    GrantedResponseAfterDurable
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    MembershipAtMostOneOutstanding
    NoForgedMessageEndpoints
    CertifiedLeaderHasFrozenQuorum
    PreCandidateTermUnbumped
    PreVoteMessagesWellFormed
    PreVoteGrantFromRoundMember

PROPERTIES
    NoPanicOnStalePreVoteGrant
