\* Discharge (membership-active seed): every omitted context step satisfies EnvUpdate.
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig = {"1"}
    TickPreVoteModes <- ReferenceTickPreVoteModes
    MaxTerm = 2
    MaxLogIndex = 4

    MaxElectionCount = 1
    MaxPreElectionCount = 1
    MaxMembershipCount = 2
    MaxCrashCount = 1
    MaxDropCount = 1
    MaxMessageCount = 4

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK
    DurableVoteNotAhead
    DurableLogNotAhead
    VoteRequestAfterDurable
    GrantedResponseAfterDurable
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    MembershipAtMostOneOutstanding
    NoForgedMessageEndpoints
    CertifiedLeaderHasFrozenQuorum
    PreCandidateTermUnbumped
    PreVoteMessagesWellFormed

PROPERTIES
    DischargeContext
