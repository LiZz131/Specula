\* Reachability witnesses for the non-empty DIFF hand-off window (expected violations).
SPECIFICATION MCSpec
CONSTANTS
    Server = {s1, s2, s3}
    Txn = {t1}
    Nil = Nil
    MaxEpoch = 2
    NewLeaderLogsPending = TRUE
    MaxCrash = 0
    MaxDrop = 0
    MaxSnapshot = 0
CHECK_DEADLOCK FALSE
SYMMETRY ModelSymmetry
INVARIANTS
    NotDiffHandoffReached
