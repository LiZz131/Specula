\* Update properties over the complete reference MCNext (guard against
\* interactions omitted by the focused view).  Three epochs are needed for a
\* committed initial history to be served and then re-elected around.
SPECIFICATION MCSpec
CONSTANTS
    Server = {s1, s2, s3}
    Txn = {t1}
    Nil = Nil
    MaxEpoch = 3
    NewLeaderLogsPending = TRUE
    MaxCrash = 2
    MaxDrop = 1
    MaxSnapshot = 1
CHECK_DEADLOCK FALSE
SYMMETRY ModelSymmetry
INVARIANTS
    TypeOK
    MCTypeOK
    ElectionSafety
    CommittedHistoriesPrefix
    AckedHistoryHandedOff
    CommittedSurvivesLeaderChange
