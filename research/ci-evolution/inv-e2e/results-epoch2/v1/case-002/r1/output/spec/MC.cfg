SPECIFICATION MCSpec

\* Canonical finite bound inherited from V0: three voters, one transaction,
\* two epochs, one occurrence of each bounded fault/recovery action.
CONSTANTS
    Server = {s1, s2, s3}
    Txn = {t1}
    MaxEpoch = 2
    Nil = Nil
    MaxCrash = 1
    MaxDrop = 1
    MaxSnapshot = 1

CHECK_DEADLOCK FALSE
SYMMETRY ModelSymmetry
CONSTRAINT CanonicalDepthBound

INVARIANTS
    TypeOK
    MCTypeOK
    ElectionSafety
    OneActiveLeaderPerEpoch
    CommittedHistoriesPrefix
    ApplyRequiresCommitCertificate
    PipelinePrefix
    EpochHistoryConsistency
    SyncCompletionJustified

\* Update properties live in Update.tla (see Update-*.cfg).

PROPERTIES
    HistoryPositionsMonotonicExceptRecovery
