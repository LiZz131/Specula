\* Canary (expected violation): a Pre-Vote round frozen on a joint config is reachable.
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig = {"1"}
    PreVoteSetting = "Runtime"
    MaxTerm = 2
    MaxLogIndex = 4

    MaxElectionCount = 1
    MaxPreVoteCount = 2
    MaxMembershipCount = 2
    MaxCrashCount = 0
    MaxDropCount = 0
    MaxMessageCount = 4
    AllowDirectOperatorElect = TRUE
    AllowExternalPreElect = TRUE

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK
    CanaryNoJointPreVoteRound
