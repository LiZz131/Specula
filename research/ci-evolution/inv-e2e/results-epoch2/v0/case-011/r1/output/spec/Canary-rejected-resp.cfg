\* Canary (expected violation): a rejected Pre-Vote response is reachable.
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    PreVoteSetting = "Runtime"
    MaxTerm = 2
    MaxLogIndex = 4

    MaxElectionCount = 1
    MaxPreVoteCount = 2
    MaxMembershipCount = 0
    MaxCrashCount = 0
    MaxDropCount = 0
    MaxMessageCount = 5
    AllowDirectOperatorElect = TRUE
    AllowExternalPreElect = TRUE

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK
    CanaryNoRejectedPreVoteResponse
