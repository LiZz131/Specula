\* Standard convergence configuration for the updated reference suite.
\* PreVoteSetting = "Runtime" admits both timer branches (the runtime flag is
\* an AtomicBool that may be toggled), so it covers the default-disabled and
\* the enabled behavior. Operator triggers (elect(false), elect(true),
\* leadership transfer) are enabled.
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 2
    MaxLogIndex = 4
    PreVoteSetting = "Runtime"

    MaxElectionCount = 2
    MaxPreVoteCount = 2
    MaxMembershipCount = 2
    MaxCrashCount = 1
    MaxDropCount = 1
    MaxMessageCount = 5
    AllowDirectOperatorElect = TRUE
    AllowExternalPreElect = TRUE

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK

    \* Core safety and persistence ordering (preserved V0 properties)
    DurableVoteNotAhead
    DurableLogNotAhead
    VoteRequestAfterDurable
    GrantedResponseAfterDurable
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    MembershipAtMostOneOutstanding
    NoForgedMessageEndpoints
    CertifiedLeaderHasFrozenQuorum

    \* Update-specific properties are defined in Update.tla and enabled by the
    \* Update-*.cfg and MC_hunt_*.cfg configurations.
