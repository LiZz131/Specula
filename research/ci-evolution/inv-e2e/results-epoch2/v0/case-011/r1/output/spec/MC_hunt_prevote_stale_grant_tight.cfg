\* Scenario U5 follow-up of MC_hunt_prevote_stale_grant.cfg with unrelated faults removed
\* (no drop) and a 4-message bound so BFS reaches the ~20-step leader-variant path.
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    PreVoteSetting = "Enabled"
    MaxTerm = 2
    MaxLogIndex = 4

    MaxElectionCount = 1
    MaxPreVoteCount = 3
    MaxMembershipCount = 2
    MaxCrashCount = 0
    MaxDropCount = 0
    MaxMessageCount = 4
    AllowDirectOperatorElect = FALSE
    AllowExternalPreElect = TRUE

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK
    DurableVoteNotAhead
    DurableLogNotAhead
    VoteRequestAfterDurable
    GrantedResponseAfterDurable
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    CertifiedLeaderHasFrozenQuorum
    MembershipAtMostOneOutstanding
    NoForgedMessageEndpoints
    PreVoteProbeIsNextTerm
    PreVoteTrackerWellFormed

PROPERTIES
    PreVoteRequestIsReadOnly
    PreElectLeavesVoteUnchanged
