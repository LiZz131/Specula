\* Canary (expected violation): a cached Leader with a timer-started Pre-Vote round is reachable.
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    PreVoteSetting = "Enabled"
    MaxTerm = 2
    MaxLogIndex = 4

    MaxElectionCount = 1
    MaxPreVoteCount = 3
    MaxMembershipCount = 0
    MaxCrashCount = 0
    MaxDropCount = 0
    MaxMessageCount = 5
    AllowDirectOperatorElect = FALSE
    AllowExternalPreElect = FALSE

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK
    NoLeader
