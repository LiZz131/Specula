\* Replays an implementation trace (Trace.tla semantics) and checks the
\* update invariants on every replayed state.
SPECIFICATION TraceSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    PreVoteSetting <- ReferencePreVoteSetting
    MaxTerm = 3
    MaxLogIndex = 4
    MaxElectionCount = 0
    MaxMembershipCount = 0
    MaxCrashCount = 0
    MaxDropCount = 0
    MaxMessageCount = 0
    MaxPreElectCount = 0
    AllowAdminElect = FALSE

VIEW TraceView

INVARIANTS
    TraceTypeOK
    TracePreCandidateTracksNextTerm
    TraceLeaderVoteCoversLocalVote

PROPERTIES
    TraceConsumed
