\* Fault-free variant (no crash, no drop): shows MC-1 needs no fault.
\* Full update check: update properties over the complete MCNext with Pre-Vote
\* enabled. Admin triggers are disabled because LeaderVoteCoversLocalVote is
\* scoped to autonomous (timer/message-driven) behavior.
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    PreVoteSetting = {TRUE}
    MaxTerm = 2
    MaxLogIndex = 4

    MaxElectionCount = 2
    MaxPreElectCount = 2
    AllowAdminElect = FALSE
    MaxMembershipCount = 2
    MaxCrashCount = 0
    MaxDropCount = 0
    MaxMessageCount = 5

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK
    \* Core safety and persistence ordering
    DurableVoteNotAhead
    DurableLogNotAhead
    VoteRequestAfterDurable
    GrantedResponseAfterDurable
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    MembershipAtMostOneOutstanding
    NoForgedMessageEndpoints
    CertifiedLeaderHasFrozenQuorum
    LeaderVoteCoversLocalVote
    PreCandidateTracksNextTerm
PROPERTIES
    PreVoteStepIsSideEffectFree
