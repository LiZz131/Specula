\* Discharge: every omitted real context Action (membership append/commit,
\* log flush) satisfies EnvUpdateStep with its frame, over full MCSpec with
\* admin triggers enabled.
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    PreVoteSetting = {FALSE, TRUE}
    MaxTerm = 2
    MaxLogIndex = 4

    MaxElectionCount = 2
    MaxPreElectCount = 2
    AllowAdminElect = TRUE
    MaxMembershipCount = 2
    MaxCrashCount = 1
    MaxDropCount = 1
    MaxMessageCount = 5

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK


PROPERTIES
    DischargeEnv
