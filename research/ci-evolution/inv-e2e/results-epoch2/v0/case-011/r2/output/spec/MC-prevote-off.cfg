\* Regression control: Pre-Vote disabled and no trigger().elect(true). The
\* reachable state graph must coincide with the prior exact-old MC.cfg run
\* (pre-candidate variables stay at their initial values).
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    PreVoteSetting = {FALSE}
    MaxTerm = 2
    MaxLogIndex = 4

    MaxElectionCount = 2
    MaxPreElectCount = 0
    AllowAdminElect = TRUE
    MaxMembershipCount = 2
    MaxCrashCount = 1
    MaxDropCount = 1
    MaxMessageCount = 5

CONSTRAINT MessageBound
VIEW ModelView

INVARIANTS
    MCTypeOK
    \* Core safety and persistence ordering
    DurableVoteNotAhead
    DurableLogNotAhead
    VoteRequestAfterDurable
    GrantedResponseAfterDurable
    LeaderRoleHasCommittedSelfVote
    CandidateRoleHasPendingSelfVote
    MembershipAtMostOneOutstanding
    NoForgedMessageEndpoints
    CertifiedLeaderHasFrozenQuorum


