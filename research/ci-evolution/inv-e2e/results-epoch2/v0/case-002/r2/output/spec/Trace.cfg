\* Trace validation of one retained NDJSON file (select with JSON=<path>).
SPECIFICATION TraceSpec
CONSTANTS
    Server <- TraceServers
    Txn <- TraceTxns
    MaxEpoch = 4
    Nil = Nil
VIEW TraceView
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    ElectionSafety
    OneActiveLeaderPerEpoch
    CommittedHistoriesPrefix
    CommittedAgreement
    ApplyRequiresCommitCertificate
    PipelinePrefix
    EpochHistoryConsistency
    SyncCompletionJustified
PROPERTIES
    TraceMatched
