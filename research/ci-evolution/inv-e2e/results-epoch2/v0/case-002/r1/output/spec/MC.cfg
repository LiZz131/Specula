\* Standard convergence config: reference safety + structural invariants.
\* Update-specific properties live in Update.tla / Update-*.cfg.
SPECIFICATION MCSpec

CONSTANTS
    Server = {s1, s2, s3}
    Txn = {t1}
    MaxEpoch = 2
    Nil = Nil
    MaxCrash = 1
    MaxDrop = 1
    MaxSnapshot = 1
    MaxShutdown = 1
    MaxDepth = 0

CHECK_DEADLOCK FALSE
SYMMETRY ModelSymmetry
CONSTRAINT DepthBound

INVARIANTS
    TypeOK
    MCTypeOK
    ElectionSafety
    OneActiveLeaderPerEpoch
    CommittedHistoriesPrefix
    ServingApplyRequiresCommitCertificate
    PipelinePrefix
    EpochHistoryConsistency
    SyncCompletionJustified

PROPERTIES
    HistoryPositionsMonotonicExceptRecovery
