    MaxEpoch = 3
    MaxCrash = 1
    MaxDrop = 0
    MaxSnapshot = 0
    MaxShutdown = 0
    MaxDepth = 0
CHECK_DEADLOCK FALSE
SYMMETRY ModelSymmetry
CONSTRAINT FocusConstraint
INVARIANTS
    TypeOK
    MCTypeOK
    ElectionSafety
    OneActiveLeaderPerEpoch
    CommittedHistoriesPrefix
    PipelinePrefix
    EpochHistoryConsistency
    SyncCompletionJustified
