\* Trace validation config.  Select a trace with the JSON environment
\* variable (IOEnv.JSON); the default is ../traces/follower-diff.ndjson.
SPECIFICATION TraceSpec

CONSTANTS
    Server = {"s0", "s1", "s2"}
    Nil = "Nil"
    Txn <- TraceTxn
    MaxEpoch <- TraceMaxEpoch

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ElectionSafety
    OneActiveLeaderPerEpoch
    CommittedHistoriesPrefix
    ServingApplyRequiresCommitCertificate
    PipelinePrefix
    EpochHistoryConsistency
    SyncCompletionJustified

PROPERTIES
    TraceMatched
