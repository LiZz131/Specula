\* plus-one experiment: generated from Update_open.cfg; changes: MaxHeight 2->3, MaxBlocks 2->3, MaxCrashes 2->3, MaxAppRollbacks 1->2
\* Open focused check: AffectedActions \/ InteractionActions \/ EnvUpdate.
\* Terminal states deadlock because EnvironmentStutter is omitted; deadlock is not a property of this lens.
\* Provisional until Update_discharge.cfg passes.
SPECIFICATION OpenSpec

CONSTANTS
    MaxHeight = 3
    MaxBlocks = 3
    MaxCrashes = 3
    MaxAppRollbacks = 2
    Bodies = {"b0", "b1", "bBad"}
    ValidBodies = {"b0", "b1"}
    VEHValues <- MCVEHValuesWithNegative
    InitialBody = "b0"
    InitialVEHs = {0, 1}
    NoParam = NoParam
    NoAbci = NoAbci

INVARIANTS
    MCTypeOK
    PersistedHeightRelationships
    SuccessfulApplyAdvancesExactlyOne
    RejectedUpdateDoesNotInstall
    ParameterUpdateReflected
    NormalPhaseIsSynchronized
    RecoveryNormalOnlySupported
    InstalledParamsBasicValid
    ContractLegalUpdateAccepted
    VEEnableHeightImmutableOnceEnabled
    VEStatusOfDecidedHeightsPreserved
    MockReplayRevalidationAccepts

CHECK_DEADLOCK FALSE
