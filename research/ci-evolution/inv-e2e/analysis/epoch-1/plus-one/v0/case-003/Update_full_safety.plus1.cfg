\* plus-one experiment: generated from Update_full_safety.cfg; changes: MaxHeight 2->3, MaxBlocks 2->3, MaxCrashes 2->3, MaxAppRollbacks 1->2
\* Full update check without the halt-freedom property, so the VE safety and
\* recovery interaction properties are explored even if P-U1 is violated early.
SPECIFICATION MCSpec

CONSTANTS
    MaxHeight = 3
    MaxBlocks = 3
    MaxCrashes = 3
    MaxAppRollbacks = 2
    Bodies = {"b0", "b1", "bBad"}
    ValidBodies = {"b0", "b1"}
    VEHValues <- MCVEHValuesWithNegative
    InitialBody = "b0"
    InitialVEHs = {0, 1}
    NoParam = NoParam
    NoAbci = NoAbci

INVARIANTS
    MCTypeOK
    PersistedHeightRelationships
    SuccessfulApplyAdvancesExactlyOne
    RejectedUpdateDoesNotInstall
    ParameterUpdateReflected
    NormalPhaseIsSynchronized
    RecoveryNormalOnlySupported
    InstalledParamsBasicValid
    VEEnableHeightImmutableOnceEnabled
    VEStatusOfDecidedHeightsPreserved
    MockReplayRevalidationAccepts
