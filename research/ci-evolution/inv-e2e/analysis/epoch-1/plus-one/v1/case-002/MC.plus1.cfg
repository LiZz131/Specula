\* plus-one experiment: generated from MC.cfg; changes: MaxEpoch 2->3, MaxCrash 1->2, MaxDrop 1->2, MaxSnapshot 1->2, MaxDepth 60->61
\* Standard convergence cfg: core safety + structural invariants over full MCNext.
SPECIFICATION MCSpec
CONSTANTS
    Server = {s1, s2, s3}
    Txn = {t1}
    MaxEpoch = 3
    Nil = Nil
    MaxCrash = 2
    MaxDrop = 2
    MaxSnapshot = 2
    MaxDepth = 61
CHECK_DEADLOCK FALSE
SYMMETRY ModelSymmetry
CONSTRAINT DepthBound
INVARIANTS
    \* type / structural
    TypeOK
    MCTypeOK
    PipelinePrefix
    EpochHistoryConsistency
    StructuralInvariants
    \* core safety
    ElectionSafety
    OneActiveLeaderPerEpoch
    CommittedHistoriesPrefix
    ServingApplyCommitted
    SyncCompletionJustified
    \* update properties are checked by Update-full.cfg (listed, not enabled here)
    \* CommittedPersistedOnQuorum
    \* LeaderCompleteness
PROPERTIES
    HistoryPositionsMonotonicExceptRecovery
