CONSTANTS
    Server = {s1, s2, s3}
    MaxEpoch = 3
    MaxTxn = 3
    NoServer = NoServer
    LearnerShutdownSemantics = "UPDATED"
    TrackCoverage = FALSE
    MaxRounds = 3
    MaxCrashes = 2
    MaxExits = 3
    MaxSnapshots = 2
SYMMETRY Symmetry
INIT MCInit
NEXT MCNext
CHECK_DEADLOCK FALSE

INVARIANTS
    MCTypeOK
    ActiveLeaderUniqueness
    AcceptedEpochGECurrentEpoch
    OrderedHistoriesMem
    CommittedPrefixAgreement
    NormalAckHasDurabilityEvidence
    ApplyHasCommitCertificate
    SyncEntryJustified
    SnapshotPublishedValidV1
    ClearedOnlyAfterSnapExit

PROPERTIES
    MonotoneUnlessRecoveryUpd
