\* plus-one experiment: generated from Update-full.cfg; changes: MaxEpoch 2->3, MaxCrash 1->2, MaxDrop 1->2, MaxSnapshot 1->2
\* Full update check: update properties over complete MCNext from MCInit.
SPECIFICATION UpdateFullSpec
CONSTANTS
    Server = {s1, s2, s3}
    Txn = {t1}
    MaxEpoch = 3
    Nil = Nil
    NewLeaderLogsPending = TRUE
    MaxCrash = 2
    MaxDrop = 2
    MaxSnapshot = 2
CHECK_DEADLOCK FALSE
CONSTRAINT TimeBudget
SYMMETRY ModelSymmetry
INVARIANTS
    TypeOK
    MCTypeOK
    ElectionSafety
    CommittedHistoriesPrefix
    ApplyRequiresCommitCertificate
    PipelinePrefix
    SyncCompletionJustified
    PendingOnlyDuringSync
    CommittedDurableOnQuorum
    LeaderCompleteness
PROPERTIES
    NewLeaderAckDurable
    HistoryPositionsMonotonicExceptRecovery
