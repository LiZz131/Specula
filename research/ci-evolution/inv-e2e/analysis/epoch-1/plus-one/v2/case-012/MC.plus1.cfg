\* plus-one experiment: generated from MC.cfg; changes: MaxTerm 1->2, MaxIndex 0->1, MaxElectionActions 1->2, MaxClientAppends 1->2, MaxMembershipChanges 0->1, MaxCrashes 0->1, MaxLosses 0->1
INIT MCInit
NEXT MCNext
CHECK_DEADLOCK FALSE

CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    Server <- MCServer
    AllowedConfigs <- MCAllowedConfigs
    MaxTerm = 2
    MaxIndex = 1
    MaxElectionActions = 2
    MaxClientAppends = 2
    MaxMembershipChanges = 1
    MaxCrashes = 1
    MaxLosses = 1

SYMMETRY Symmetry
VIEW MCView
CONSTRAINT MessageBufferBound

INVARIANTS
    MCTypeOK
    ElectionSafety
    ActiveLeaderHasCommittedVote
    CommitWithinLocalLog
    CommittedLogAgreement
    MembershipOrder
    EffectiveIsLastLogMembership

\* Scenario invariants are enabled in focused hunt configs.
\* CommitWitnessSound (V0, superseded; see Update!CommitWitnessSound_new)
\* OneOutstandingMembership
