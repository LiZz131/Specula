\* plus-one experiment: generated from MC.cfg; changes: MaxEpoch 2->3, MaxTxn 1->2, MaxLearnerExits 1->2
CONSTANTS
    Server = {s1, s2, s3}
    MaxEpoch = 3
    MaxTxn = 2
    NoServer = NoServer
    TrackCoverage = FALSE
    MaxLearnerExits = 2
    CodeVersion = "new"

SYMMETRY Symmetry
INIT MCInit
NEXT MCCoreNext
CHECK_DEADLOCK FALSE

INVARIANTS
    MCTypeOK
    ActiveLeaderUniqueness
    AcceptedEpochGECurrentEpoch
    OrderedHistories
    CommittedPrefixAgreement
    NormalAckHasDurabilityEvidence
    ApplyHasCommitCertificate
    SyncEntryJustified
    SnapshotPublishedValid

PROPERTIES
    MonotoneUnlessRecovery
