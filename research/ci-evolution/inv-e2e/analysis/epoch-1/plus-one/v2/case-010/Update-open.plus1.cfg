\* plus-one experiment: generated from Update-open.cfg; changes: MaxEpoch 1->2, MaxTxn 1->2, MaxLearnerExits 2->3
CONSTANTS
    Server = {s1, s2, s3}
    MaxEpoch = 2
    MaxTxn = 2
    NoServer = NoServer
    TrackCoverage = FALSE
    MaxLearnerExits = 3
    CodeVersion = "new"

SYMMETRY UpdSymmetry
INIT MCInit
NEXT OpenUpdateNext
CHECK_DEADLOCK FALSE

INVARIANTS
    MCTypeOK
    ActiveLeaderUniqueness
    AcceptedEpochGECurrentEpoch
    OrderedHistories
    CommittedPrefixAgreement
    NormalAckHasDurabilityEvidence
    ApplyHasCommitCertificate
    SyncEntryJustified
    SnapshotPublishedValid
    UpdIdleDbBackedByDisk
    UpdDurableCoversCommitted

PROPERTIES
    MonotoneUnlessRecovery
