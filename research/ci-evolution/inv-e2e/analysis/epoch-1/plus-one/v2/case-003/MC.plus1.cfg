\* plus-one experiment: generated from MC.cfg; changes: MaxHeight 3->4, MaxBlocks 3->4, MaxCrashes 2->3, MaxAppRollbacks 1->2
\* Standard convergence config: reference safety + structural invariants.
SPECIFICATION MCSpec

CONSTANTS
    MaxHeight = 4
    MaxBlocks = 4
    MaxCrashes = 3
    MaxAppRollbacks = 2
    Rest = {"r0", "r1", "rBad"}
    ValidRest = {"r0", "r1"}
    VEProposals = {0, 1, 2, 3, 4}
    VEValues <- MCVEValues
    NoRest = "none"
    InitialRest = "r0"
    InitialVEs = {0, 2}
    InitialParams <- MCInitialParams

INVARIANTS
    MCTypeOK
    PersistedHeightRelationships
    SuccessfulApplyAdvancesExactlyOne
    RejectedUpdateDoesNotInstall
    ParameterUpdateReflected
    NormalPhaseIsSynchronized
    RecoveryNormalOnlySupported
\* Update/extension properties are checked by Update_full.cfg and the hunt cfgs:
\*  VEHistoryStable VEEnableMonotone StartupLastCommitConsistent
\*  AcceptedVEUpdateRespectsRules PermittedVEUpdateNotRejected
\*  UnchangedVEUpdateNotRejected
