\* Scenario U4: Pre-Vote rounds are identified only by the probed leader id; a later round with the same probe may count responses of an earlier round (and panic in grant_by after a membership change).
SPECIFICATION MCSpec

CONSTANTS
    Server <- ReferenceServer
    NodeOrder <- ReferenceNodeOrder
    InitialConfig <- ReferenceInitialConfig
    MaxTerm = 2
    MaxLogIndex = 4
    TickPreVoteModes = {TRUE}
    PreVoteFallbackPeers = {}

    MaxElectionCount = 1
    MaxPreVoteCount = 3
    MaxMembershipCount = 2
    MaxCrashCount = 0
    MaxDropCount = 1
    MaxMessageCount = 5

CONSTRAINT MessageBound
VIEW ModelView

INVARIANT ProbeNoB
