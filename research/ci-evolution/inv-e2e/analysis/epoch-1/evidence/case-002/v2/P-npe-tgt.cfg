    MaxEpoch = 1
    Nil = Nil
    NewLeaderLogsPending = TRUE
    MaxCrash = 0
    MaxDrop = 0
    MaxSnapshot = 0

CHECK_DEADLOCK FALSE
SYMMETRY ModelSymmetry

INVARIANTS
    ProbeNoNPE
