SPECIFICATION TraceSpec

CONSTANTS
    Target = {"0", "1", "2"}
    MaxIndex = 1000
    MaxInflight = 1000000
    MaxAttempts = 1000000
    AllowLogReversion = FALSE

VIEW TraceView

PROPERTIES
    TraceMatched

INVARIANTS
    TypeOK
    OnePayloadInflight
    SentRangeWellFormed
    WorkerMatchWithinSent
    PartialContinuationBounded
    WaitRequiresBackoff
    WaitCountBoundedByAttempts
    ProgressBounds
    SnapshotInflightConsistent
    StreamTerminalStable

CHECK_DEADLOCK FALSE
